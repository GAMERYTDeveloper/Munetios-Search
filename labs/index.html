<!doctype html>
<html lang="en">
  <head>

    <meta

    />
    <link

    <link

      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0..1&display=swap"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,1..1000,80&display=swap");
      * {
        box-sizing: border-box;
        font-family: "Google Sans Flex", sans-serif;
        font-variation-settings: "wght" 500, "ROND" 80;
        font-feature-settings: "ss01" on;
        scroll-behavior: smooth;
      }
      button {
        all: unset;
      }
      body {
        font-family: "Google Sans Flex", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #0d0235;
        color: rgb(255, 255, 255);
      }
      .topbar-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        height: 80px;
        position: sticky;
        top: 0;
        border-radius: 0;
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
      }
      .logo {
        height: 50px;
        margin-right: 20px;
        display: flex;
        align-items: center;
        font-weight: 600;
        font-size: 1.5em;
        gap: 10px;
      }
      .logo-text {
        font-variation-settings: "wght" 700 "ROND" 100;
      }
      .btn {
        cursor: pointer;
        padding: 10px 18px;
        border-radius: 84px;
        border: 1px solid rgba(103, 28, 201, 0.644);
        background-color: rgba(103, 28, 201, 0.644);
        transition: background-color 0.3s ease;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn:hover {
        background-color: rgba(103, 28, 201, 0.844);
      }
      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
        * {
          scroll-behavior: auto;
        }
      }
      @media (prefers-color-scheme: light) {
        body {
          background-color: #f5f5f5;
          color: #1a1a1a;
        }
        .logo {
          color: #1a1a1a !important;
        }
      }
      .content-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .banner-for-test-new-features {
        background: linear-gradient(90deg, #6a0dad, #8a2be2, #6a0dad);
        background-size: 200% 200%;
        animation: gradientAnimation 5s ease infinite;
        color: white;
        padding: 40px 60px;
        height: 100%;
        min-height: 400px;
        width: 100%;
        border-radius: 16px;
        font-size: 1.5em;
        font-weight: 600;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }
      @keyframes gradientAnimation {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .banner-for-test-new-features #animatedText {
        text-align: center;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
        font-size: 56px;
        font-weight: 700;
      }
      @media (max-width: 700px) {
        .banner-for-test-new-features {
          padding: 20px 30px;
        }
        .banner-for-test-new-features #animatedText {
          font-size: 32px;
        }
      }
      @media (max-width: 400px) {
        .banner-for-test-new-features #animatedText {
          font-size: 24px;
        }
      }
      @media (max-width: 1200px) {
        .content-container {
          padding: 30px 15px;
        }
      }

      @media (max-width: 900px) {
        .topbar-container {
          padding: 0 15px;
          height: 70px;
        }
        .logo {
          font-size: 1.3em;
          height: 45px;
        }
        .btn {
          padding: 8px 15px;
          font-size: 0.95em;
        }
      }

      @media (max-width: 600px) {
        .topbar-container {
          padding: 0 10px;
          height: 60px;
        }
        .logo {
          font-size: 1.1em;
          height: 40px;
          gap: 8px;
        }
        .btn {
          padding: 6px 12px;
          font-size: 0.9em;
        }
        .content-container {
          padding: 20px 10px;
        }
        .banner-for-test-new-features {
          min-height: 300px;
        }
      }

      @media (max-width: 350px) {
        .logo-text {
          display: none;
        }
        .banner-for-test-new-features {
          padding: 15px 20px;
          min-height: 250px;
        }
        .banner-for-test-new-features #animatedText {
          font-size: 20px;
        }
      }
      .grid-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        width: 100%;
        margin-top: 20px;
      }
      .box-labs {
        padding: 20px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .labs-list {
        width: 100%;
        max-width: 1200px;
        margin-top: 40px;
      }
      .labs-list h2 {
        margin-bottom: 10px;
      }
      .footer {
        margin-top: 40px;
        padding: 20px;
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
        position: relative;
        width: 100%;
        display: flex;
        align-items: center;
        bottom: -130px;
      }
    </style>
  </head>
  <body>
    <div class="main-app-container">
      <div class="topbar-container liquid-glass">
        <div
          class="logo"
          style="color: white; font-weight: 600; font-size: 1.5em; gap: 10px"
        >
          <span class="material-symbols-rounded">science</span>
          <div class="logo-text">Munetios Labs</div>
        </div>
        <div class="top-right">
          <nav>
            <div class="navbar">
              <button class="btn" id="munetiosHome">Munetios</button>
            </div>
          </nav>
        </div>
      </div>
      <div class="content-container">
        <div class="banner-for-test-new-features">
          <div id="animatedText"></div>
        </div>
        <div class="labs-list">
          <h2>Search Labs:</h2>
          <div class="grid-list">
            <p>No search labs available at the moment.</p>
          </div>
          <h2>Other:</h2>
          <div class="grid-list">
          
            <div class="box-labs liquid-glass">
              <h2>Secure Notes</h2>
              <p>Manage your secure, encrypted notes.</p>
              <button class="btn" id="secureNotesBtn">Try it</button>
            </div>
            <div class="box-labs liquid-glass">
              <h2>Secure Folders</h2>
              <p>Upload files, photos, and videos with end-to-end encryption.</p>
              <button class="btn" id="secureFoldersBtn">Try it</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer liquid-glass">
      <div class="footer-content">
        <div class="left-footer">
          <p>&copy; 2026 Munetios. Open Source.</p>
        </div>
        <div class="right-footer">
          <a href="https://www.munetios.com/policies/#/privacy"
            >Privacy Policy</a
          >
          <a href="https://www.munetios.com/policies/#/terms"
            >Terms of Service</a
          >
          <a href="https://www.munetios.com">Munetios</a>
        </div>
      </div>
    </div>
    <script nonce="2jSjSbegDIjwnXikejssx">
      document
        .getElementById("secureNotesBtn")
        .addEventListener("click", function () {
          window.location.href = "https://www.munetios.com/labs/notes";
        });
      document
        .getElementById("secureFoldersBtn")
        .addEventListener("click", function () {
          window.location.href = "https://www.munetios.com/labs/secure-folders";
        });

      document
        .getElementById("munetiosHome")
        .addEventListener("click", function () {
          window.location.href = "https://www.munetios.com";
        });

      const animatedText = document.getElementById("animatedText");
      const messages = [
        "Test new features",
        "Discover experimental projects",
        "Contribute to innovation",
      ];
      let messageIndex = 0;
      let charIndex = 0;

      function typeMessage() {
        if (charIndex < messages[messageIndex].length) {
          animatedText.textContent += messages[messageIndex].charAt(charIndex);
          charIndex++;
          setTimeout(typeMessage, 100);
        } else {
          setTimeout(eraseMessage, 2000);
        }
      }

      function eraseMessage() {
        if (charIndex > 0) {
          animatedText.textContent = messages[messageIndex].substring(
            0,
            charIndex - 1,
          );
          charIndex--;
          setTimeout(eraseMessage, 50);
        } else {
          messageIndex = (messageIndex + 1) % messages.length;
          setTimeout(typeMessage, 500);
        }
      }

      typeMessage();
      // Check for schoolMode in localStorage
      if (localStorage.getItem("schoolMode") === "true") {
        document.body.innerHTML =
          '<div style="display:flex;justify-content:center;align-items:center;height:100vh;font-size:2em;font-weight:700;">Sorry, Labs is not available in school mode</div>';
      }
    </script>
  </body>
</html>
