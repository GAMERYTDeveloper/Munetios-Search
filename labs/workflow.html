<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#241047" />
    <title>Munetios Workflow BETA</title>
    <link
      rel="stylesheet"
      href="https://api.munetios.com/beautiful-css/beautiful.css"
    />
    <link rel="shortcut icon" href="logo.png" type="image/x-icon" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #12091f;
        --bg-deep: #090511;
        --panel: rgba(39, 18, 73, 0.6);
        --panel-strong: rgba(47, 22, 89, 0.78);
        --panel-soft: rgba(255, 255, 255, 0.07);
        --line: rgba(255, 255, 255, 0.13);
        --line-strong: rgba(255, 255, 255, 0.24);
        --text: #fbf8ff;
        --muted: rgba(251, 248, 255, 0.7);
        --faint: rgba(251, 248, 255, 0.5);
        --primary: #a879ff;
        --primary-strong: #7c3dff;
        --primary-soft: rgba(168, 121, 255, 0.18);
        --accent: #f4c2ff;
        --green: #56e39f;
        --yellow: #ffd166;
        --red: #ff6b8a;
        --blue: #83c5ff;
        --radius: 8px;
        --shadow: 0 22px 80px rgba(0, 0, 0, 0.38);
        --font:
          "Google Sans Flex", "Google Sans", "Segoe UI", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg-deep);
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(
            circle at 18% 12%,
            rgba(124, 61, 255, 0.32),
            transparent 34rem
          ),
          radial-gradient(
            circle at 82% 0%,
            rgba(244, 194, 255, 0.2),
            transparent 28rem
          ),
          linear-gradient(145deg, #150925 0%, #231041 47%, #0c0714 100%);
        overflow-x: hidden;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        border: 0;
      }

      a {
        color: inherit;
      }

      .app-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: transparent;
        padding: 12px;
      }

      .liquid-glass {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.055)
        );
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        backdrop-filter: blur(3px) saturate(135%);
        -webkit-backdrop-filter: blur(3px) saturate(135%);
      }

      .topbar-surface {
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-radius: 22px;
        padding: 10px;
      }

      .brand {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 10px;
      }

      .brand-logo {
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
        object-fit: contain;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--line);
        padding: 4px;
      }

      .brand-copy {
        display: grid;
        gap: 1px;
        min-width: 0;
      }

      .brand-title {
        margin: 0;
        font-size: clamp(1rem, 4vw, 1.22rem);
        line-height: 1.1;
        letter-spacing: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .brand-subtitle {
        color: var(--muted);
        font-size: 0.78rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .icon-button,
      .primary-button,
      .secondary-button,
      .danger-button,
      .tab-button,
      .chip-button {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: var(--radius);
        color: var(--text);
        cursor: pointer;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease,
          opacity 160ms ease;
      }

      .icon-button {
        width: 42px;
        padding: 0;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--line);
      }

      .icon-button:hover,
      .primary-button:hover,
      .secondary-button:hover,
      .danger-button:hover,
      .tab-button:hover,
      .chip-button:hover {
        transform: translateY(-1px);
        border-color: var(--line-strong);
      }

      .icon-button:disabled,
      .primary-button:disabled,
      .secondary-button:disabled,
      .danger-button:disabled,
      .tab-button:disabled,
      .chip-button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        transform: none;
      }

      .primary-button {
        padding: 0 14px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-strong)
        );
        border: 1px solid rgba(255, 255, 255, 0.2);
        font-weight: 700;
      }

      .secondary-button {
        padding: 0 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--line);
      }

      .danger-button {
        padding: 0 14px;
        background: rgba(255, 107, 138, 0.14);
        border: 1px solid rgba(255, 107, 138, 0.34);
      }

      .chip-button {
        min-height: 34px;
        padding: 0 11px;
        background: rgba(255, 255, 255, 0.075);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.88rem;
      }

      .chip-button.active {
        color: var(--text);
        background: var(--primary-soft);
        border-color: rgba(168, 121, 255, 0.48);
      }

      .app-main {
        width: min(1520px, 100%);
        margin: 0 auto;
        padding: 0 12px 28px;
        display: grid;
        gap: 16px;
        flex: 1;
      }

      .workspace-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        min-height: calc(100vh - 112px);
      }

      .sidebar,
      .panel,
      .tool-panel {
        border-radius: 18px;
      }

      .sidebar {
        display: grid;
        gap: 16px;
        align-content: start;
        padding: 16px;
      }

      .nav-tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .tab-button {
        min-height: 44px;
        padding: 0 10px;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid transparent;
        color: var(--muted);
        justify-content: flex-start;
      }

      .tab-button.active {
        color: var(--text);
        background: var(--primary-soft);
        border-color: rgba(168, 121, 255, 0.48);
      }

      .section-title {
        margin: 0;
        font-size: 0.86rem;
        color: var(--muted);
        letter-spacing: 0;
        font-weight: 700;
      }

      .workflow-list {
        display: grid;
        gap: 8px;
        max-height: 260px;
        overflow: auto;
        padding-right: 2px;
      }

      .workflow-item {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        text-align: left;
        padding: 11px;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border: 1px solid transparent;
        cursor: pointer;
      }

      .workflow-item.active {
        background: rgba(168, 121, 255, 0.17);
        border-color: rgba(168, 121, 255, 0.5);
      }

      .workflow-name {
        font-weight: 700;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .workflow-meta {
        color: var(--faint);
        font-size: 0.78rem;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--primary);
      }

      .status-dot.planning {
        background: var(--blue);
      }

      .status-dot.active {
        background: var(--green);
      }

      .status-dot.paused {
        background: var(--yellow);
      }

      .status-dot.archived {
        background: var(--faint);
      }

      .compact-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .stat-tile {
        display: grid;
        gap: 3px;
        padding: 10px;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line);
      }

      .stat-value {
        font-size: 1.15rem;
        font-weight: 800;
      }

      .stat-label {
        color: var(--faint);
        font-size: 0.73rem;
        overflow-wrap: anywhere;
      }

      .main-panel {
        min-width: 0;
        display: grid;
        gap: 16px;
        align-content: start;
      }

      .panel {
        padding: 16px;
      }

      .view-header {
        display: grid;
        gap: 12px;
        align-items: start;
      }

      .view-heading {
        display: grid;
        gap: 6px;
      }

      .view-title {
        margin: 0;
        font-size: clamp(1.35rem, 6vw, 2.35rem);
        letter-spacing: 0;
        line-height: 1.04;
      }

      .view-subtitle {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
        max-width: 74ch;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .toolbar.end {
        justify-content: flex-end;
      }

      .search-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field.inline {
        grid-template-columns: 1fr;
        align-items: center;
      }

      .field label,
      .field-label {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .input,
      .textarea,
      .select {
        width: 100%;
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        outline: 0;
        transition:
          border-color 160ms ease,
          background 160ms ease,
          box-shadow 160ms ease;
      }

      .input,
      .select {
        min-height: 44px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        line-height: 44px;
      }

      .select {
        padding-right: 38px;
        background-image:
          linear-gradient(
            45deg,
            transparent 50%,
            rgba(251, 248, 255, 0.86) 50%
          ),
          linear-gradient(
            135deg,
            rgba(251, 248, 255, 0.86) 50%,
            transparent 50%
          );
        background-position:
          calc(100% - 20px) 19px,
          calc(100% - 14px) 19px;
        background-size:
          6px 6px,
          6px 6px;
        background-repeat: no-repeat;
        text-overflow: ellipsis;
      }

      .textarea {
        min-height: 112px;
        padding: 12px;
        resize: vertical;
      }

      .input:focus,
      .textarea:focus,
      .select:focus {
        border-color: rgba(168, 121, 255, 0.78);
        box-shadow: 0 0 0 3px rgba(168, 121, 255, 0.17);
        background: rgba(255, 255, 255, 0.11);
      }

      .empty-state {
        min-height: 260px;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 26px 18px;
        border-radius: 18px;
        border: 1px dashed rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.045);
      }

      .empty-state-content {
        display: grid;
        gap: 14px;
        justify-items: center;
        max-width: 560px;
      }

      .empty-icon {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        color: var(--accent);
        background: var(--primary-soft);
        border: 1px solid rgba(168, 121, 255, 0.42);
      }

      .empty-state h2,
      .empty-state h3 {
        margin: 0;
        font-size: clamp(1.25rem, 5vw, 1.8rem);
      }

      .empty-state p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .mindmap-shell {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .mindmap-stage {
        position: relative;
        min-height: 520px;
        overflow: hidden;
        border-radius: 18px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.045) 1px,
            transparent 1px
          ),
          rgba(255, 255, 255, 0.04);
        background-size: 34px 34px;
        border: 1px solid var(--line);
        touch-action: none;
      }

      .mindmap-connections {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .mindmap-viewport {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
      }

      .mind-node {
        position: absolute;
        width: 220px;
        min-height: 116px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 8px;
        padding: 12px;
        border-radius: 14px;
        background: rgba(26, 12, 48, 0.82);
        border: 1px solid var(--line-strong);
        box-shadow: 0 18px 54px rgba(0, 0, 0, 0.28);
        cursor: grab;
        user-select: none;
      }

      .mind-node.selected {
        border-color: rgba(244, 194, 255, 0.82);
        box-shadow:
          0 18px 54px rgba(0, 0, 0, 0.28),
          0 0 0 3px rgba(168, 121, 255, 0.22);
      }

      .mind-node.dragging {
        cursor: grabbing;
      }

      .mind-node-title {
        margin: 0;
        font-size: 1rem;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .mind-node-notes {
        color: var(--muted);
        font-size: 0.84rem;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .node-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .node-pill {
        min-width: 0;
        min-height: 24px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        color: var(--text);
        border-radius: 999px;
        font-size: 0.72rem;
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid var(--line);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .mindmap-side {
        display: grid;
        gap: 12px;
      }

      .node-list,
      .task-list,
      .activity-list {
        display: grid;
        gap: 8px;
      }

      .node-row,
      .task-row,
      .activity-row {
        display: grid;
        gap: 8px;
        padding: 11px;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line);
      }

      .node-row {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
      }

      .node-row-main,
      .task-main {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .row-title {
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .row-meta {
        color: var(--faint);
        font-size: 0.78rem;
        overflow-wrap: anywhere;
      }

      .task-board {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .task-column {
        min-height: 220px;
        display: grid;
        align-content: start;
        gap: 10px;
        padding: 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid var(--line);
      }

      .task-column-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .task-column-title {
        margin: 0;
        font-size: 0.95rem;
      }

      .count-badge {
        min-width: 28px;
        height: 28px;
        display: inline-grid;
        place-items: center;
        border-radius: 999px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid var(--line);
        font-size: 0.82rem;
        font-weight: 800;
      }

      .task-card {
        display: grid;
        gap: 10px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(21, 9, 39, 0.8);
        border: 1px solid var(--line);
      }

      .task-card.done {
        opacity: 0.72;
      }

      .task-card-header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 8px;
      }

      .task-title {
        margin: 0;
        font-size: 0.98rem;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .task-desc {
        margin: 0;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.42;
        overflow-wrap: anywhere;
      }

      .task-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag {
        min-height: 24px;
        display: inline-flex;
        align-items: center;
        padding: 0 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.72rem;
      }

      .priority-high {
        color: #ffd6df;
        border-color: rgba(255, 107, 138, 0.36);
        background: rgba(255, 107, 138, 0.13);
      }

      .priority-medium {
        color: #fff0bd;
        border-color: rgba(255, 209, 102, 0.36);
        background: rgba(255, 209, 102, 0.12);
      }

      .priority-low {
        color: #c7f7dd;
        border-color: rgba(86, 227, 159, 0.34);
        background: rgba(86, 227, 159, 0.12);
      }

      .task-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .details-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .metric-card {
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid var(--line);
      }

      .metric-card strong {
        display: block;
        font-size: clamp(1.45rem, 8vw, 2.25rem);
        line-height: 1;
      }

      .metric-card span {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .progress-shell {
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid var(--line);
      }

      .progress-bar {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--primary), var(--green));
      }

      .settings-grid,
      .form-grid {
        display: grid;
        gap: 12px;
      }

      .form-grid.two,
      .form-grid.three {
        grid-template-columns: 1fr;
      }

      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid var(--line);
      }

      .switch-copy {
        display: grid;
        gap: 3px;
      }

      .switch-copy strong {
        font-size: 0.95rem;
      }

      .switch-copy span {
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.35;
      }

      .toggle {
        position: relative;
        width: 50px;
        height: 30px;
        flex: 0 0 auto;
      }

      .toggle input {
        position: absolute;
        opacity: 0;
        inset: 0;
      }

      .toggle span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.13);
        border: 1px solid var(--line);
        cursor: pointer;
      }

      .toggle span::after {
        content: "";
        position: absolute;
        width: 22px;
        height: 22px;
        left: 3px;
        top: 3px;
        border-radius: 50%;
        background: #fff;
        transition: transform 180ms ease;
      }

      .toggle input:checked + span {
        background: var(--primary-strong);
      }

      .toggle input:checked + span::after {
        transform: translateX(20px);
      }

      .modal-region {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
      }

      .modal-layer {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        pointer-events: auto;
      }

      .modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(6, 3, 12, 0.46);
      }

      .modal-layer.opening .modal-backdrop {
        animation: modalBackdropIn 180ms ease-out both;
      }

      .modal {
        position: relative;
        width: min(620px, 100%);
        max-height: min(84vh, 760px);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        overflow: hidden;
        border-radius: 20px;
        color: var(--text);
      }

      .modal-layer.opening .modal {
        animation: modalPanelIn 240ms cubic-bezier(0.16, 1, 0.3, 1) both;
        transform-origin: center center;
      }

      .modal-header,
      .modal-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px;
      }

      .modal-title {
        margin: 0;
        font-size: 1.12rem;
        line-height: 1.2;
      }

      .modal-body {
        min-height: 0;
        overflow: auto;
        padding: 0 14px 14px;
      }

      .modal-footer {
        flex-wrap: wrap;
        justify-content: flex-end;
        border-top: 1px solid var(--line);
      }

      .toast-region {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 300;
        display: grid;
        gap: 8px;
        width: min(380px, calc(100vw - 24px));
        pointer-events: none;
      }

      .toast {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: start;
        padding: 12px;
        border-radius: 14px;
        pointer-events: auto;
        animation: toastIn 180ms ease-out;
      }

      .toast strong {
        display: block;
        font-size: 0.92rem;
      }

      .toast span {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.35;
      }

      .toast.success {
        border-color: rgba(86, 227, 159, 0.34);
      }

      .toast.warning {
        border-color: rgba(255, 209, 102, 0.38);
      }

      .toast.error {
        border-color: rgba(255, 107, 138, 0.42);
      }

      .toast.info {
        border-color: rgba(168, 121, 255, 0.46);
      }

      .hidden {
        display: none !important;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes modalBackdropIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes modalPanelIn {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.975);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .modal-layer.opening .modal,
        .modal-layer.opening .modal-backdrop,
        .toast {
          animation: none;
        }
      }

      @media (min-width: 680px) {
        .topbar {
          padding: 14px 18px;
        }

        .topbar-surface {
          padding: 11px 12px;
        }

        .app-main {
          padding: 0 18px 28px;
        }

        .nav-tabs {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .view-header {
          grid-template-columns: minmax(0, 1fr) auto;
          align-items: center;
        }

        .search-row {
          grid-template-columns: minmax(220px, 1fr) 180px 180px;
          align-items: end;
        }

        .form-grid.two {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .form-grid.three {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .details-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 980px) {
        .workspace-grid {
          grid-template-columns: 300px minmax(0, 1fr);
          align-items: start;
        }

        .sidebar {
          position: sticky;
          top: 100px;
          max-height: calc(100vh - 118px);
          overflow: auto;
        }

        .nav-tabs {
          grid-template-columns: 1fr;
        }

        .mindmap-shell {
          grid-template-columns: minmax(0, 1fr) 320px;
          align-items: start;
        }

        .task-board {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (min-width: 1180px) {
        .topbar-surface {
          border-radius: 26px;
        }

        .panel,
        .sidebar {
          padding: 16px;
        }

        .mindmap-stage {
          min-height: 650px;
        }
      }

      @media (max-width: 520px) {
        .brand-subtitle {
          display: none;
        }

        .topbar-actions .secondary-button span,
        .topbar-actions .primary-button span,
        .toolbar .primary-button span,
        .toolbar .secondary-button span,
        .toolbar .danger-button span {
          display: none;
        }

        .topbar-actions {
          gap: 6px;
        }

        .primary-button,
        .secondary-button,
        .danger-button {
          min-width: 42px;
          padding: 0 10px;
        }

        .metric-grid {
          grid-template-columns: 1fr;
        }

        .modal-layer {
          padding: 10px;
          place-items: end center;
        }

        .modal {
          max-height: 88vh;
          border-radius: 18px 18px 0 0;
        }
      }
      /* New customizable native select support */
    </style>

            viewReset: "Vista del mapa reiniciada.",

            stackOpened: "Capa modal abierta.",
            searchOpened: "Búsqueda abierta.",
            settingsSaved: "Configuración guardada.",
            nodeMoved: "Nodo movido.",
            workflow: "Flujo",
            node: "Nodo",
            task: "Tarea",
            description: "Descripción",
            notes: "Notas",
            status: "Estado",
            createdAt: "Creado",
            updatedAt: "Actualizado",
            taskBoard: "Tablero de tareas",
            overview: "Vista general",
            localOnly: "Solo local",
            pasteJson: "Pegar JSON",
            importMode: "Modo de importación",
            replaceAll: "Reemplazar todos los datos",
            mergeData: "Combinar con datos locales",
            chooseWorkflow: "Elegir flujo",
            selected: "Seleccionado",
            dragToMove: "Arrastra para mover",
            taskCount: "Cantidad de tareas",

          },

        translations["es-US"] = translations.es;
        translations["es-ES"] = {
          ...translations.es,
          settings: "Ajustes",
          settingsSaved: "Ajustes guardados.",
        };

        const state = {
          db: null,
          language: "en",
          view: "mindmap",
          workflows: [],
          nodes: [],
          tasks: [],
          activeWorkflowId: null,
          selectedNodeId: null,
          settings: {
            language: "en",
            privacyMode: false,
            compactMode: false,
            viewport: { x: 0, y: 0, scale: 1 },
          },
          filters: {
            taskSearch: "",
            taskStatus: "all",
            taskSort: "newest",
            nodeSearch: "",
          },
          modals: [],
          openingModalId: null,
          toasts: [],
          drag: null,
          autosaveTimer: null,
        };

        const el = {
          viewRoot: document.getElementById("viewRoot"),
          workflowList: document.getElementById("workflowList"),
          languageSelect: document.getElementById("languageSelect"),
          modalRegion: document.getElementById("modalRegion"),
          toastRegion: document.getElementById("toastRegion"),
          sidebarNodeCount: document.getElementById("sidebarNodeCount"),
          sidebarTaskCount: document.getElementById("sidebarTaskCount"),
          sidebarDoneCount: document.getElementById("sidebarDoneCount"),
        };

        const uid = () => {
          if (crypto.randomUUID) return crypto.randomUUID();
          return `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        };

        const now = () => new Date().toISOString();

        const t = (key) => {
          const dict = translations[state.language] || translations.en;
          return dict[key] || translations.en[key] || key;
        };

        const normalizeLanguage = (language) => {
          if (language === "es") return "es-US";
          if (language === "en-US") return "en";
          return translations[language] ? language : "en";
        };

        const languageLocale = () => {
          if (state.language === "es-ES") return "es-ES";
          if (state.language === "es-US" || state.language === "es")
            return "es-US";
          return "en-US";
        };

        const escapeHtml = (value) =>
          String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

        const parseDate = (value) => {
          if (!value) return null;
          const parsed = new Date(`${value}T00:00:00`);
          return Number.isNaN(parsed.getTime()) ? null : parsed;
        };

        const formatDate = (value) => {
          if (!value) return t("noDueDate");
          const date = parseDate(value) || new Date(value);
          if (Number.isNaN(date.getTime())) return t("noDueDate");
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const target = new Date(date);
          target.setHours(0, 0, 0, 0);
          const diffDays = Math.round((target - today) / 86400000);
          if (diffDays === 0) return t("today");
          if (diffDays === 1) return t("tomorrow");
          if (diffDays < 0) return t("overdue");
          return date.toLocaleDateString(languageLocale(), {
            month: "short",
            day: "numeric",
            year:
              date.getFullYear() === today.getFullYear()
                ? undefined
                : "numeric",
          });
        };

        const formatDateTime = (value) => {
          if (!value) return t("none");
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return t("none");
          return date.toLocaleString(languageLocale(), {
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit",
          });
        };

        const priorityRank = { high: 3, medium: 2, low: 1 };

        const statusOptions = {
          workflow: ["planning", "active", "paused", "archived"],
          node: ["idea", "next", "blocked", "complete"],
          task: ["todo", "doing", "done"],
          priority: ["low", "medium", "high"],
        };

        const nodeColors = [
          "#a879ff",
          "#f4c2ff",
          "#83c5ff",
          "#56e39f",
          "#ffd166",
          "#ff6b8a",
        ];

        const openDb = () =>
          new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onupgradeneeded = () => {
              const db = request.result;
              if (!db.objectStoreNames.contains("workflows")) {
                const store = db.createObjectStore("workflows", {
                  keyPath: "id",
                });
                store.createIndex("updatedAt", "updatedAt");
              }
              if (!db.objectStoreNames.contains("nodes")) {
                const store = db.createObjectStore("nodes", { keyPath: "id" });
                store.createIndex("workflowId", "workflowId");
                store.createIndex("parentId", "parentId");
                store.createIndex("updatedAt", "updatedAt");
              }
              if (!db.objectStoreNames.contains("tasks")) {
                const store = db.createObjectStore("tasks", { keyPath: "id" });
                store.createIndex("workflowId", "workflowId");
                store.createIndex("nodeId", "nodeId");
                store.createIndex("status", "status");
                store.createIndex("updatedAt", "updatedAt");
              }
              if (!db.objectStoreNames.contains("settings")) {
                db.createObjectStore("settings", { keyPath: "key" });
              }
            };

            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });

        const tx = (stores, mode = "readonly") =>
          state.db.transaction(stores, mode);

        const getAll = (storeName) =>
          new Promise((resolve, reject) => {
            const request = tx([storeName]).objectStore(storeName).getAll();
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => reject(request.error);
          });

        const getSetting = (key) =>
          new Promise((resolve, reject) => {
            const request = tx(["settings"]).objectStore("settings").get(key);
            request.onsuccess = () => resolve(request.result?.value);
            request.onerror = () => reject(request.error);
          });

        const putRecord = (storeName, value) =>
          new Promise((resolve, reject) => {
            const transaction = tx([storeName], "readwrite");
            transaction.objectStore(storeName).put(value);
            transaction.oncomplete = () => resolve(value);
            transaction.onerror = () => reject(transaction.error);
          });

        const deleteRecord = (storeName, id) =>
          new Promise((resolve, reject) => {
            const transaction = tx([storeName], "readwrite");
            transaction.objectStore(storeName).delete(id);
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error);
          });

        const bulkPut = (storeName, values) =>
          new Promise((resolve, reject) => {
            const transaction = tx([storeName], "readwrite");
            const store = transaction.objectStore(storeName);
            values.forEach((value) => store.put(value));
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error);
          });

        const bulkDelete = (storeName, ids) =>
          new Promise((resolve, reject) => {
            const transaction = tx([storeName], "readwrite");
            const store = transaction.objectStore(storeName);
            ids.forEach((id) => store.delete(id));
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error);
          });

        const clearStores = (storeNames) =>
          new Promise((resolve, reject) => {
            const transaction = tx(storeNames, "readwrite");
            storeNames.forEach((storeName) =>
              transaction.objectStore(storeName).clear(),
            );
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error);
          });

        const saveSettings = async () => {
          state.settings.language = state.language;
          await putRecord("settings", { key: "app", value: state.settings });
        };

        const loadData = async () => {
          const [workflows, nodes, tasks, savedSettings] = await Promise.all([
            getAll("workflows"),
            getAll("nodes"),
            getAll("tasks"),
            getSetting("app"),
          ]);
          state.workflows = workflows.sort(
            (a, b) => new Date(b.updatedAt) - new Date(a.updatedAt),
          );
          state.nodes = nodes;
          state.tasks = tasks;
          state.settings = { ...state.settings, ...(savedSettings || {}) };
          state.language = normalizeLanguage(state.settings.language || "en");
          state.settings.language = state.language;
          state.activeWorkflowId =
            state.settings.activeWorkflowId || state.workflows[0]?.id || null;
          if (
            state.activeWorkflowId &&
            !state.workflows.some(
              (workflow) => workflow.id === state.activeWorkflowId,
            )
          ) {
            state.activeWorkflowId = state.workflows[0]?.id || null;
          }
          el.languageSelect.value = state.language;
          document.documentElement.lang = state.language;
        };

        const activeWorkflow = () =>
          state.workflows.find(
            (workflow) => workflow.id === state.activeWorkflowId,
          ) || null;
        const workflowNodes = (workflowId = state.activeWorkflowId) =>
          state.nodes.filter((node) => node.workflowId === workflowId);
        const workflowTasks = (workflowId = state.activeWorkflowId) =>
          state.tasks.filter((task) => task.workflowId === workflowId);
        const selectedNode = () =>
          state.nodes.find((node) => node.id === state.selectedNodeId) || null;

        const touchWorkflow = async (workflowId = state.activeWorkflowId) => {
          const workflow = state.workflows.find(
            (item) => item.id === workflowId,
          );
          if (!workflow) return;
          workflow.updatedAt = now();
          await putRecord("workflows", workflow);
        };

        const showToast = (type, title, message = "") => {
          const id = uid();
          const toast = { id, type, title, message };
          state.toasts.push(toast);
          renderToasts();
          window.setTimeout(() => {
            state.toasts = state.toasts.filter((item) => item.id !== id);
            renderToasts();
          }, 4200);
        };

        const renderToasts = () => {
          el.toastRegion.innerHTML = state.toasts
            .map(
              (toast) => `
            <div class="toast liquid-glass ${escapeHtml(toast.type)}" role="status">
              <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none">
                ${
                  toast.type === "error"
                    ? '<path d="M12 8v5m0 3h.01M10.3 4.2 2.7 18a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />'
                    : '<path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />'
                }
              </svg>
              <span><strong>${escapeHtml(toast.title)}</strong>${toast.message ? `<span>${escapeHtml(toast.message)}</span>` : ""}</span>
              <button class="icon-button" type="button" style="width: 30px; height: 30px; min-height: 30px;" data-toast-close="${escapeHtml(toast.id)}" aria-label="${escapeHtml(t("close"))}">
                <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
              </button>
            </div>
          `,
            )
            .join("");
        };

        const openModal = ({
          title,
          body,
          footer = "",
          width = "620px",
          onMount,
        }) => {
          const id = uid();
          state.modals.push({ id, title, body, footer, width, onMount });
          state.openingModalId = id;
          renderModals();
          window.setTimeout(() => {
            if (state.openingModalId === id) state.openingModalId = null;
          }, 280);
          return id;
        };

        const closeModal = (id) => {
          state.modals = state.modals.filter((modal) => modal.id !== id);
          renderModals();
        };

        const closeTopModal = () => {
          const top = state.modals[state.modals.length - 1];
          if (top) closeModal(top.id);
        };

        const renderModals = () => {
          el.modalRegion.innerHTML = state.modals
            .map(
              (modal, index) => `
            <div class="modal-layer ${modal.id === state.openingModalId ? "opening" : ""}" data-modal-layer="${escapeHtml(modal.id)}" style="z-index: ${100 + index * 3};">
              <div class="modal-backdrop" data-modal-close="${escapeHtml(modal.id)}"></div>
              <section class="modal liquid-glass" role="dialog" aria-modal="true" aria-label="${escapeHtml(modal.title)}" style="width: min(${escapeHtml(modal.width)}, 100%);">
                <header class="modal-header">
                  <h2 class="modal-title">${escapeHtml(modal.title)}</h2>
                  <button class="icon-button" type="button" data-modal-close="${escapeHtml(modal.id)}" aria-label="${escapeHtml(t("close"))}">
                    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                      <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                  </button>
                </header>
                <div class="modal-body">${modal.body}</div>
                ${modal.footer ? `<footer class="modal-footer">${modal.footer}</footer>` : ""}
              </section>
            </div>
          `,
            )
            .join("");
          state.modals.forEach((modal) => {
            const layer = el.modalRegion.querySelector(
              `[data-modal-layer="${CSS.escape(modal.id)}"]`,
            );
            if (layer && typeof modal.onMount === "function") {
              modal.onMount(layer, modal.id);
            }
          });
        };

        const setView = (view) => {
          state.view = view;
          document.querySelectorAll(".tab-button").forEach((button) => {
            button.classList.toggle("active", button.dataset.view === view);
          });
          render();
        };

        const setActiveWorkflow = async (id) => {
          state.activeWorkflowId = id;
          state.selectedNodeId = null;
          state.settings.activeWorkflowId = id;
          await saveSettings();
          render();
        };

        const renderStaticI18n = () => {
          document.querySelectorAll("[data-i18n]").forEach((item) => {
            item.textContent = t(item.dataset.i18n);
          });
          const searchButton = document.querySelector(
            "[data-action='open-search']",
          );
          const stackButton = document.querySelector(
            "[data-action='open-stack-demo']",
          );
          if (searchButton) searchButton.title = t("search");
          if (stackButton) stackButton.title = t("stack");
          document.documentElement.lang = state.language;
        };

        const renderWorkflowList = () => {
          if (!state.workflows.length) {
            el.workflowList.innerHTML = `<div class="row-meta">${escapeHtml(t("emptyWorkflowList"))}</div>`;
            return;
          }

          el.workflowList.innerHTML = state.workflows
            .map((workflow) => {
              const nodes = workflowNodes(workflow.id).length;
              const tasks = workflowTasks(workflow.id).length;
              return `
              <button class="workflow-item ${workflow.id === state.activeWorkflowId ? "active" : ""}" type="button" data-workflow-id="${escapeHtml(workflow.id)}">
                <span>
                  <span class="workflow-name">${escapeHtml(workflow.name || t("untitled"))}</span>
                  <span class="workflow-meta">${nodes} ${escapeHtml(t("nodes"))} · ${tasks} ${escapeHtml(t("tasks"))}</span>
                </span>
                <span class="status-dot ${escapeHtml(workflow.status || "planning")}" style="background: ${escapeHtml(workflow.color || "#a879ff")}"></span>
              </button>
            `;
            })
            .join("");
        };

        const renderSidebarStats = () => {
          const nodes = workflowNodes();
          const tasks = workflowTasks();
          el.sidebarNodeCount.textContent = String(nodes.length);
          el.sidebarTaskCount.textContent = String(tasks.length);
          el.sidebarDoneCount.textContent = String(
            tasks.filter((task) => task.status === "done").length,
          );
        };

        const render = () => {
          renderStaticI18n();
          renderWorkflowList();
          renderSidebarStats();
          if (!state.workflows.length) {
            renderEmptyApp();
            return;
          }
          if (!activeWorkflow()) {
            state.activeWorkflowId = state.workflows[0]?.id || null;
          }
          if (state.view === "mindmap") renderMindmapView();
          if (state.view === "tasks") renderTasksView();
          if (state.view === "insights") renderInsightsView();
          if (state.view === "settings") renderSettingsView();
        };

        const renderEmptyApp = () => {
          el.viewRoot.innerHTML = `
            <section class="empty-state liquid-glass">
              <div class="empty-state-content">
                <div class="empty-icon">
                  <svg aria-hidden="true" width="31" height="31" viewBox="0 0 24 24" fill="none">
                    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                  </svg>
                </div>
                <h2>${escapeHtml(t("noWorkflowsTitle"))}</h2>
                <p>${escapeHtml(t("noWorkflowsBody"))}</p>
                <button class="primary-button" type="button" data-action="new-workflow">
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                  </svg>
                  <span>${escapeHtml(t("createWorkflow"))}</span>
                </button>
              </div>
            </section>
          `;
        };

        const viewHeader = (title, subtitle, actions = "") => `
          <header class="view-header panel liquid-glass">
            <div class="view-heading">
              <h2 class="view-title">${escapeHtml(title)}</h2>
              <p class="view-subtitle">${escapeHtml(subtitle)}</p>
            </div>
            <div class="toolbar end">${actions}</div>
          </header>
        `;

        const renderMindmapView = () => {
          const workflow = activeWorkflow();
          const nodes = filteredNodes();
          const allNodes = workflowNodes();
          const hasNodes = allNodes.length > 0;
          const selected = selectedNode();
          const workflowTitle = workflow?.name || t("untitled");

          el.viewRoot.innerHTML = `
            ${viewHeader(
              workflowTitle,
              workflow?.description && !state.settings.privacyMode
                ? workflow.description
                : `${t("mindmap")} · ${t(workflow?.status || "planning")} · ${t("localOnly")}`,
              `
                <button class="secondary-button" type="button" data-action="edit-workflow">
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                  </svg>
                  <span>${escapeHtml(t("edit"))}</span>
                </button>
                <button class="primary-button" type="button" data-action="new-node">
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                  </svg>
                  <span>${escapeHtml(t("addNode"))}</span>
                </button>
                <button class="secondary-button" type="button" data-action="new-task">
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M8 7h11M8 12h11M8 17h11M4.5 7l1 1 2-2M4.5 12l1 1 2-2M4.5 17l1 1 2-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  <span>${escapeHtml(t("addTask"))}</span>
                </button>
              `,
            )}
            <section class="panel liquid-glass">
              <div class="search-row">
                <div class="field">
                  <label for="nodeSearch">${escapeHtml(t("search"))}</label>
                  <input class="input" id="nodeSearch" data-field="node-search" type="search" value="${escapeHtml(state.filters.nodeSearch)}" placeholder="${escapeHtml(t("nodeSearchPlaceholder"))}" />
                </div>
                <div class="field">
                  <label>${escapeHtml(t("overview"))}</label>
                  <button class="secondary-button" type="button" data-action="reset-view">
                    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                      <path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>${escapeHtml(t("resetView"))}</span>

                </div>
                <div class="field">
                  <label>${escapeHtml(t("dragToMove"))}</label>
                  <button class="secondary-button" type="button" data-action="fit-view">
