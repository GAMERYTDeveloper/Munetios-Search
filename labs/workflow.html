                      <path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3m18 0v3a2 2 0 0 1-2 2h-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>${escapeHtml(t("fitView"))}</span>
                  </button>
                </div>
              </div>
            </section>
            ${
              hasNodes
                ? `
              <section class="mindmap-shell">
                <div class="mindmap-stage" id="mindmapStage">
                  <svg class="mindmap-connections" id="mindmapConnections"></svg>
                  <div class="mindmap-viewport" id="mindmapViewport">
                    ${nodes.map(renderMindNode).join("")}
                  </div>
                </div>
                <aside class="mindmap-side">
                  ${renderSelectedNodePanel(selected)}
                  <section class="panel liquid-glass">
                    <div class="toolbar" style="justify-content: space-between; margin-bottom: 10px;">
                      <h3 class="section-title">${escapeHtml(t("allNodes"))}</h3>
                      <span class="count-badge">${allNodes.length}</span>
                    </div>
                    <div class="node-list">
                      ${nodes.length ? nodes.map(renderNodeRow).join("") : `<div class="row-meta">${escapeHtml(t("noResults"))}</div>`}
                    </div>
                  </section>
                </aside>
              </section>
            `
                : `
              <section class="empty-state liquid-glass">
                <div class="empty-state-content">
                  <div class="empty-icon">
                    <svg aria-hidden="true" width="31" height="31" viewBox="0 0 24 24" fill="none">
                      <path d="M12 12h5m-5 0H7m5 0V7m0 5v5M5 5h4v4H5V5Zm10 0h4v4h-4V5ZM5 15h4v4H5v-4Zm10 0h4v4h-4v-4Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  </div>
                  <h2>${escapeHtml(t("emptyMindmapTitle"))}</h2>
                  <p>${escapeHtml(t("emptyMindmapBody"))}</p>
                  <button class="primary-button" type="button" data-action="new-node">
                    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                    </svg>
                    <span>${escapeHtml(t("addNode"))}</span>
                  </button>
                </div>
              </section>
            `
            }
          `;

          if (hasNodes) {
            requestAnimationFrame(() => {
              applyViewport();
              drawConnections();
            });
          }
        };

        const filteredNodes = () => {
          const query = state.filters.nodeSearch.trim().toLowerCase();
          return workflowNodes().filter((node) => {
            if (!query) return true;
            return `${node.title} ${node.notes}`.toLowerCase().includes(query);
          });
        };

        const renderMindNode = (node) => {
          const linkedTasks = workflowTasks().filter(
            (task) => task.nodeId === node.id,
          );
          const doneCount = linkedTasks.filter(
            (task) => task.status === "done",
          ).length;
          const notes = state.settings.privacyMode ? "" : node.notes || "";
          return `
            <article class="mind-node ${node.id === state.selectedNodeId ? "selected" : ""}" data-node-id="${escapeHtml(node.id)}" style="left: ${Number(node.x) || 0}px; top: ${Number(node.y) || 0}px; border-top: 4px solid ${escapeHtml(node.color || "#a879ff")}">
              <h3 class="mind-node-title">${escapeHtml(node.title || t("untitled"))}</h3>
              <div class="mind-node-notes">${escapeHtml(notes || t(node.status || "idea"))}</div>
              <div class="node-footer">
                <span class="node-pill">${escapeHtml(t(node.status || "idea"))}</span>
                <span class="node-pill">${doneCount}/${linkedTasks.length} ${escapeHtml(t("tasks"))}</span>
              </div>
            </article>
          `;
        };

        const renderNodeRow = (node) => {
          const childCount = workflowNodes().filter(
            (item) => item.parentId === node.id,
          ).length;
          const taskCount = workflowTasks().filter(
            (task) => task.nodeId === node.id,
          ).length;
          return `
            <article class="node-row">
              <button class="workflow-item ${node.id === state.selectedNodeId ? "active" : ""}" type="button" data-select-node="${escapeHtml(node.id)}" style="padding: 0; background: transparent; border: 0;">
                <span>
                  <span class="workflow-name">${escapeHtml(node.title || t("untitled"))}</span>
                  <span class="workflow-meta">${childCount} ${escapeHtml(t("nodes"))} · ${taskCount} ${escapeHtml(t("tasks"))}</span>
                </span>
                <span class="status-dot" style="background: ${escapeHtml(node.color || "#a879ff")}"></span>
              </button>
              <button class="icon-button" type="button" data-edit-node="${escapeHtml(node.id)}" aria-label="${escapeHtml(t("edit"))}">
                <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none">
                  <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                </svg>
              </button>
            </article>
          `;
        };

        const renderSelectedNodePanel = (node) => {
          if (!node) {
            return `
              <section class="panel liquid-glass">
                <h3 class="section-title" style="margin-bottom: 8px;">${escapeHtml(t("selectedNode"))}</h3>
                <div class="row-meta">${escapeHtml(t("none"))}</div>
              </section>
            `;
          }
          const tasks = workflowTasks().filter(
            (task) => task.nodeId === node.id,
          );
          return `
            <section class="panel liquid-glass">
              <div class="toolbar" style="justify-content: space-between; margin-bottom: 10px;">
                <h3 class="section-title">${escapeHtml(t("selectedNode"))}</h3>
                <button class="icon-button" type="button" data-edit-node="${escapeHtml(node.id)}" aria-label="${escapeHtml(t("edit"))}">
                  <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none">
                    <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
              <div class="node-row-main">
                <strong class="row-title">${escapeHtml(node.title || t("untitled"))}</strong>
                <span class="row-meta">${escapeHtml(t(node.status || "idea"))} · ${escapeHtml(formatDateTime(node.updatedAt))}</span>
                ${node.notes && !state.settings.privacyMode ? `<span class="row-meta">${escapeHtml(node.notes)}</span>` : ""}
              </div>
              <div class="toolbar" style="margin-top: 12px;">
                <button class="secondary-button" type="button" data-action="new-task" data-node-context="${escapeHtml(node.id)}">
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                  </svg>
                  <span>${escapeHtml(t("addTask"))}</span>
                </button>
              </div>
              <h3 class="section-title" style="margin: 14px 0 8px;">${escapeHtml(t("linkedTasks"))}</h3>
              <div class="task-list">
                ${tasks.length ? tasks.map(renderCompactTask).join("") : `<div class="row-meta">${escapeHtml(t("none"))}</div>`}
              </div>
            </section>
          `;
        };

        const renderCompactTask = (task) => `
          <article class="task-row">
            <div class="task-main">
              <strong class="row-title">${escapeHtml(task.title || t("untitled"))}</strong>
              <span class="row-meta">${escapeHtml(t(task.status || "todo"))} · ${escapeHtml(formatDate(task.dueDate))}</span>
            </div>
          </article>
        `;

        const renderTasksView = () => {
          const workflow = activeWorkflow();
          const tasks = filteredTasks();
          const groups = {
            todo: tasks.filter((task) => task.status === "todo"),
            doing: tasks.filter((task) => task.status === "doing"),
            done: tasks.filter((task) => task.status === "done"),
          };

          el.viewRoot.innerHTML = `
            ${viewHeader(
              t("taskBoard"),
              workflow?.name || t("untitled"),
              `
                <button class="primary-button" type="button" data-action="new-task">
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                  </svg>
                  <span>${escapeHtml(t("addTask"))}</span>
                </button>
              `,
            )}
            <section class="panel liquid-glass">
              <div class="search-row">
                <div class="field">
                  <label for="taskSearch">${escapeHtml(t("search"))}</label>
                  <input class="input" id="taskSearch" data-field="task-search" type="search" value="${escapeHtml(state.filters.taskSearch)}" placeholder="${escapeHtml(t("taskSearchPlaceholder"))}" />
                </div>
                <div class="field">
                  <label for="taskStatusFilter">${escapeHtml(t("filter"))}</label>
                  <select class="select" id="taskStatusFilter" data-field="task-status">
                    ${["all", "todo", "doing", "done"].map((status) => `<option value="${status}" ${state.filters.taskStatus === status ? "selected" : ""}>${escapeHtml(t(status))}</option>`).join("")}
                  </select>
                </div>
                <div class="field">
                  <label for="taskSort">${escapeHtml(t("sort"))}</label>
                  <select class="select" id="taskSort" data-field="task-sort">
                    ${["newest", "oldest", "dueSoon", "prioritySort"].map((sort) => `<option value="${sort}" ${state.filters.taskSort === sort ? "selected" : ""}>${escapeHtml(t(sort))}</option>`).join("")}
                  </select>
                </div>
              </div>
            </section>
            ${
              workflowTasks().length
                ? `
              <section class="task-board">
                ${["todo", "doing", "done"]
                  .map(
                    (status) => `
                  <div class="task-column">
                    <div class="task-column-header">
                      <h3 class="task-column-title">${escapeHtml(t(status))}</h3>
                      <span class="count-badge">${groups[status].length}</span>
                    </div>
                    ${groups[status].length ? groups[status].map(renderTaskCard).join("") : `<div class="row-meta">${escapeHtml(t("noResults"))}</div>`}
                  </div>
                `,
                  )
                  .join("")}
              </section>
            `
                : `
              <section class="empty-state liquid-glass">
                <div class="empty-state-content">
                  <div class="empty-icon">
                    <svg aria-hidden="true" width="31" height="31" viewBox="0 0 24 24" fill="none">
                      <path d="M8 7h11M8 12h11M8 17h11M4.5 7l1 1 2-2M4.5 12l1 1 2-2M4.5 17l1 1 2-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  </div>
                  <h2>${escapeHtml(t("noTasksTitle"))}</h2>
                  <p>${escapeHtml(t("noTasksBody"))}</p>
                  <button class="primary-button" type="button" data-action="new-task">
                    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                    </svg>
                    <span>${escapeHtml(t("addTask"))}</span>
                  </button>
                </div>
              </section>
            `
            }
          `;
        };

        const filteredTasks = () => {
          const query = state.filters.taskSearch.trim().toLowerCase();
          let tasks = workflowTasks().filter((task) => {
            const matchesQuery =
              !query ||
              `${task.title} ${task.description}`.toLowerCase().includes(query);
            const matchesStatus =
              state.filters.taskStatus === "all" ||
              task.status === state.filters.taskStatus;
            return matchesQuery && matchesStatus;
          });

          tasks = tasks.sort((a, b) => {
            if (state.filters.taskSort === "oldest")
              return new Date(a.createdAt) - new Date(b.createdAt);
            if (state.filters.taskSort === "dueSoon") {
              const aTime =
                parseDate(a.dueDate)?.getTime() ?? Number.MAX_SAFE_INTEGER;
              const bTime =
                parseDate(b.dueDate)?.getTime() ?? Number.MAX_SAFE_INTEGER;
              return aTime - bTime;
            }
            if (state.filters.taskSort === "prioritySort") {
              return (
                (priorityRank[b.priority] || 0) -
                (priorityRank[a.priority] || 0)
              );
            }
            return new Date(b.createdAt) - new Date(a.createdAt);
          });

          return tasks;
        };

        const renderTaskCard = (task) => {
          const node = state.nodes.find((item) => item.id === task.nodeId);
          return `
            <article class="task-card ${task.status === "done" ? "done" : ""}">
              <div class="task-card-header">
                <h3 class="task-title">${escapeHtml(task.title || t("untitled"))}</h3>
                <button class="icon-button" type="button" data-edit-task="${escapeHtml(task.id)}" aria-label="${escapeHtml(t("edit"))}" style="width: 36px; height: 36px; min-height: 36px;">
                  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
              ${task.description && !state.settings.privacyMode ? `<p class="task-desc">${escapeHtml(task.description)}</p>` : ""}
              <div class="task-tags">
                <span class="tag priority-${escapeHtml(task.priority || "medium")}">${escapeHtml(t(task.priority || "medium"))}</span>
                <span class="tag">${escapeHtml(formatDate(task.dueDate))}</span>
                ${node ? `<span class="tag">${escapeHtml(node.title || t("untitled"))}</span>` : ""}
              </div>
              <div class="task-actions">
                ${task.status !== "todo" ? `<button class="chip-button" type="button" data-task-status="${escapeHtml(task.id)}" data-status="todo">${escapeHtml(t("todo"))}</button>` : ""}
                ${task.status !== "doing" ? `<button class="chip-button" type="button" data-task-status="${escapeHtml(task.id)}" data-status="doing">${escapeHtml(t("doing"))}</button>` : ""}
                ${task.status !== "done" ? `<button class="chip-button" type="button" data-task-status="${escapeHtml(task.id)}" data-status="done">${escapeHtml(t("done"))}</button>` : ""}
              </div>
            </article>
          `;
        };

        const renderInsightsView = () => {
          const workflow = activeWorkflow();
          const nodes = workflowNodes();
          const tasks = workflowTasks();
          const done = tasks.filter((task) => task.status === "done").length;
          const overdue = tasks.filter(
            (task) =>
              task.status !== "done" &&
              parseDate(task.dueDate) &&
              parseDate(task.dueDate) < startOfToday(),
          ).length;
          const upcoming = tasks.filter(
            (task) =>
              task.status !== "done" &&
              parseDate(task.dueDate) &&
              parseDate(task.dueDate) >= startOfToday(),
          ).length;
          const linked = tasks.filter((task) => task.nodeId).length;
          const completion = tasks.length
            ? Math.round((done / tasks.length) * 100)
            : 0;
          const coverage = tasks.length
            ? Math.round((linked / tasks.length) * 100)
            : 0;
          const activity = [
            ...nodes.map((node) => ({
              type: "node",
              title: node.title,
              updatedAt: node.updatedAt,
            })),
            ...tasks.map((task) => ({
              type: "task",
              title: task.title,
              updatedAt: task.updatedAt,
            })),
            ...(workflow
              ? [
                  {
                    type: "workflow",
                    title: workflow.name,
                    updatedAt: workflow.updatedAt,
                  },
                ]
              : []),
          ]
            .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
            .slice(0, 8);

          el.viewRoot.innerHTML = `
            ${viewHeader(t("insights"), workflow?.name || t("untitled"))}
            <section class="panel liquid-glass">
              <div class="metric-grid">
                ${renderMetric(t("nodeCount"), nodes.length)}
                ${renderMetric(t("taskCount"), tasks.length)}
                ${renderMetric(t("completion"), `${completion}%`)}
                ${renderMetric(t("nodeCoverage"), `${coverage}%`)}
              </div>
            </section>
            <section class="details-grid">
              <div class="panel liquid-glass">
                <h3 class="section-title" style="margin-bottom: 12px;">${escapeHtml(t("progress"))}</h3>
                <div class="field">
                  <div class="toolbar" style="justify-content: space-between;">
                    <span class="row-meta">${escapeHtml(t("done"))}</span>
                    <strong>${done}/${tasks.length}</strong>
                  </div>
                  <div class="progress-shell"><div class="progress-bar" style="width: ${completion}%"></div></div>
                </div>
                <div class="form-grid two" style="margin-top: 12px;">
                  ${renderMetric(t("overdueTasks"), overdue)}
                  ${renderMetric(t("upcomingTasks"), upcoming)}
                </div>
              </div>
              <div class="panel liquid-glass">
                <h3 class="section-title" style="margin-bottom: 12px;">${escapeHtml(t("recentActivity"))}</h3>
                <div class="activity-list">
                  ${
                    activity.length
                      ? activity
                          .map(
                            (item) => `
                    <article class="activity-row">
                      <strong class="row-title">${escapeHtml(item.title || t("untitled"))}</strong>
                      <span class="row-meta">${escapeHtml(t(item.type))} · ${escapeHtml(formatDateTime(item.updatedAt))}</span>
                    </article>
                  `,
                          )
                          .join("")
                      : `<div class="row-meta">${escapeHtml(t("noActivity"))}</div>`
                  }
                </div>
              </div>
            </section>
          `;
        };

        const startOfToday = () => {
          const date = new Date();
          date.setHours(0, 0, 0, 0);
          return date;
        };

        const renderMetric = (label, value) => `
          <div class="metric-card">
            <strong>${escapeHtml(value)}</strong>
            <span>${escapeHtml(label)}</span>
          </div>
        `;

        const renderSettingsView = () => {
          el.viewRoot.innerHTML = `
            ${viewHeader(
              t("settings"),
              t("localOnly"),
              `
              <button class="secondary-button" type="button" data-action="export-json">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>${escapeHtml(t("export"))}</span>
              </button>
              <button class="secondary-button" type="button" data-action="import-json">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M12 21V9m0 0 4 4m-4-4-4 4M5 3h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>${escapeHtml(t("import"))}</span>
              </button>
            `,
            )}
            <section class="details-grid">
              <div class="panel liquid-glass">
                <h3 class="section-title" style="margin-bottom: 12px;">${escapeHtml(t("settings"))}</h3>
                <div class="settings-grid">
                  <label class="switch-row">
                    <span class="switch-copy">
                      <strong>${escapeHtml(t("privacyMode"))}</strong>
                      <span>${escapeHtml(t("privacyModeText"))}</span>
                    </span>
                    <span class="toggle">
                      <input type="checkbox" data-setting="privacyMode" ${state.settings.privacyMode ? "checked" : ""} />
                      <span></span>
                    </span>
                  </label>
                  <label class="switch-row">
                    <span class="switch-copy">
                      <strong>${escapeHtml(t("compactMode"))}</strong>
                      <span>${escapeHtml(t("compactModeText"))}</span>
                    </span>
                    <span class="toggle">
                      <input type="checkbox" data-setting="compactMode" ${state.settings.compactMode ? "checked" : ""} />
                      <span></span>
                    </span>
                  </label>
                </div>
              </div>
              <div class="panel liquid-glass">
                <h3 class="section-title" style="margin-bottom: 12px;">${escapeHtml(t("dataTools"))}</h3>
                <div class="settings-grid">
                  <button class="secondary-button" type="button" data-action="export-json">${escapeHtml(t("exportJson"))}</button>
                  <button class="secondary-button" type="button" data-action="import-json">${escapeHtml(t("importJson"))}</button>
                  <button class="danger-button" type="button" data-action="clear-workflow">${escapeHtml(t("clearWorkflow"))}</button>
                  <button class="danger-button" type="button" data-action="clear-all">${escapeHtml(t("clearAllData"))}</button>
                </div>
              </div>
            </section>
          `;
        };

        const workflowForm = (workflow = {}) => {
          const color = workflow.color || nodeColors[0];
          return `
            <form id="workflowForm" class="form-grid">
              <div class="field">
                <label for="workflowName">${escapeHtml(t("workflowName"))}</label>
                <input class="input" id="workflowName" name="name" required value="${escapeHtml(workflow.name || "")}" maxlength="90" />
              </div>
              <div class="field">
                <label for="workflowDescription">${escapeHtml(t("workflowDescription"))}</label>
                <textarea class="textarea" id="workflowDescription" name="description" maxlength="800">${escapeHtml(workflow.description || "")}</textarea>
              </div>
              <div class="form-grid two">
                <div class="field">
                  <label for="workflowStatus">${escapeHtml(t("workflowStatus"))}</label>
                  <select class="select" id="workflowStatus" name="status">
                    ${statusOptions.workflow.map((status) => `<option value="${status}" ${workflow.status === status ? "selected" : ""}>${escapeHtml(t(status))}</option>`).join("")}
                  </select>
                </div>
                <div class="field">
                  <span class="field-label">${escapeHtml(t("color"))}</span>
                  <div class="toolbar">
                    ${nodeColors
                      .map(
                        (item) => `
                      <label class="icon-button" style="background: ${escapeHtml(item)}; border-color: ${item === color ? "#fff" : "transparent"};">
                        <input class="sr-only" type="radio" name="color" value="${escapeHtml(item)}" ${item === color ? "checked" : ""} />
                        <span class="sr-only">${escapeHtml(item)}</span>
                      </label>
                    `,
                      )
                      .join("")}
                  </div>
                </div>
              </div>
            </form>
          `;
        };

        const openWorkflowModal = (workflow = null) => {
          const editing = Boolean(workflow);
          const id = openModal({
            title: editing ? t("editWorkflow") : t("createWorkflow"),
            body: workflowForm(workflow || {}),
            footer: `
              ${editing ? `<button class="danger-button" type="button" data-confirm-delete-workflow="${escapeHtml(workflow.id)}">${escapeHtml(t("delete"))}</button>` : ""}
              ${editing ? `<button class="secondary-button" type="button" data-duplicate-workflow="${escapeHtml(workflow.id)}">${escapeHtml(t("duplicate"))}</button>` : ""}
              <button class="secondary-button" type="button" data-modal-close="${idMarker()}">${escapeHtml(t("cancel"))}</button>
              <button class="primary-button" type="submit" form="workflowForm">${escapeHtml(editing ? t("save") : t("create"))}</button>
            `,
            onMount: (layer, modalId) => {
              layer
                .querySelector("[data-modal-close='__MODAL__']")
                ?.setAttribute("data-modal-close", modalId);
              layer
                .querySelector("#workflowForm")
                .addEventListener("submit", async (event) => {
                  event.preventDefault();
                  const data = new FormData(event.currentTarget);
                  const name = String(data.get("name") || "").trim();
                  if (!name) {
                    showToast("error", t("error"), t("nameRequired"));
                    return;
                  }
                  const timestamp = now();
                  if (editing) {
                    Object.assign(workflow, {
                      name,
                      description: String(data.get("description") || "").trim(),
                      status: String(data.get("status") || "planning"),
                      color: String(data.get("color") || nodeColors[0]),
                      updatedAt: timestamp,
                    });
                    await putRecord("workflows", workflow);
                    showToast("success", t("updated"), t("workflowUpdated"));
                  } else {
                    const created = {
                      id: uid(),
                      name,
                      description: String(data.get("description") || "").trim(),
                      status: String(data.get("status") || "planning"),
                      color: String(data.get("color") || nodeColors[0]),
                      createdAt: timestamp,
                      updatedAt: timestamp,
                    };
                    await putRecord("workflows", created);
                    state.activeWorkflowId = created.id;
                    state.settings.activeWorkflowId = created.id;
                    await saveSettings();
                    showToast("success", t("created"), t("workflowCreated"));
                  }
                  await loadData();
                  closeModal(modalId);
                  render();
                });
            },
          });
          return id;
        };

        const idMarker = () => "__MODAL__";

        const nodeForm = (node = {}, contextNodeId = "") => {
          const nodes = workflowNodes().filter((item) => item.id !== node.id);
          const color =
            node.color ||
            nodeColors[nodes.length % nodeColors.length] ||
            nodeColors[0];
          return `
            <form id="nodeForm" class="form-grid">
              <div class="field">
                <label for="nodeTitle">${escapeHtml(t("nodeTitle"))}</label>
                <input class="input" id="nodeTitle" name="title" required value="${escapeHtml(node.title || "")}" maxlength="90" />
              </div>
              <div class="field">
                <label for="nodeNotes">${escapeHtml(t("nodeNotes"))}</label>
                <textarea class="textarea" id="nodeNotes" name="notes" maxlength="900">${escapeHtml(node.notes || "")}</textarea>
              </div>
              <div class="form-grid two">
                <div class="field">
                  <label for="parentNode">${escapeHtml(t("parentNode"))}</label>
                  <select class="select" id="parentNode" name="parentId">
                    <option value="">${escapeHtml(t("noParent"))}</option>
                    ${nodes.map((item) => `<option value="${escapeHtml(item.id)}" ${(node.parentId || contextNodeId) === item.id ? "selected" : ""}>${escapeHtml(item.title || t("untitled"))}</option>`).join("")}
                  </select>
                </div>
                <div class="field">
                  <label for="nodeStatus">${escapeHtml(t("nodeStatus"))}</label>
                  <select class="select" id="nodeStatus" name="status">
                    ${statusOptions.node.map((status) => `<option value="${status}" ${node.status === status ? "selected" : ""}>${escapeHtml(t(status))}</option>`).join("")}
                  </select>
                </div>
              </div>
              <div class="field">
                <span class="field-label">${escapeHtml(t("color"))}</span>
                <div class="toolbar">
                  ${nodeColors
                    .map(
                      (item) => `
                    <label class="icon-button" style="background: ${escapeHtml(item)}; border-color: ${item === color ? "#fff" : "transparent"};">
                      <input class="sr-only" type="radio" name="color" value="${escapeHtml(item)}" ${item === color ? "checked" : ""} />
                      <span class="sr-only">${escapeHtml(item)}</span>
                    </label>
                  `,
                    )
                    .join("")}
                </div>
              </div>
            </form>
          `;
        };

        const openNodeModal = (node = null, contextNodeId = "") => {
          if (!activeWorkflow()) {
            showToast("warning", t("error"), t("noWorkflowsTitle"));
            return;
          }
          const editing = Boolean(node);
          openModal({
            title: editing ? t("edit") : t("addNode"),
            body: nodeForm(node || {}, contextNodeId),
            footer: `

                      notes: String(data.get("notes") || "").trim(),

        const nextNodePosition = () => {
          const nodes = workflowNodes();
          if (!nodes.length) return { x: 80, y: 80 };
          const index = nodes.length;
          const angle = index * 0.85;
          const radius = 190 + Math.floor(index / 7) * 130;
          return {
            x: Math.round(420 + Math.cos(angle) * radius),
            y: Math.round(260 + Math.sin(angle) * radius),
          };
        };

        const padDatePart = (value) => String(value).padStart(2, "0");

        const toDateValue = (date) =>
          `${date.getFullYear()}-${padDatePart(date.getMonth() + 1)}-${padDatePart(date.getDate())}`;

        const toMonthValue = (date) =>
          `${date.getFullYear()}-${padDatePart(date.getMonth() + 1)}`;

        const parseMonthValue = (value) => {
          const [year, month] = String(value || "")
            .split("-")
            .map(Number);
          if (!year || !month) return null;
          return new Date(year, month - 1, 1);
        };

        const locale = () => languageLocale();

        const formatCalendarDateLabel = (value) => {
          const date = parseDate(value);
          if (!date) return t("noDueDate");
          return date.toLocaleDateString(locale(), {
            weekday: "short",
            month: "short",
            day: "numeric",
            year: "numeric",
          });
        };

        const renderDatePicker = (selectedValue = "") => {
          const selectedDate = parseDate(selectedValue);
          const monthDate = selectedDate || new Date();
          return `
            <div class="date-field" data-date-picker data-month="${escapeHtml(toMonthValue(monthDate))}">
              <input id="taskDueDate" name="dueDate" type="hidden" value="${escapeHtml(selectedValue)}" />
              <button class="date-trigger" id="taskDueDateButton" type="button" data-date-toggle aria-expanded="false">
                <span data-date-label>${escapeHtml(formatCalendarDateLabel(selectedValue))}</span>
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M7 3v3m10-3v3M4 9h16M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <div class="date-popover liquid-glass hidden" data-date-popover>
                ${renderDatePickerCalendar(monthDate, selectedValue)}
              </div>
            </div>
          `;
        };

        const renderDatePickerCalendar = (monthDate, selectedValue = "") => {
          const first = new Date(
            monthDate.getFullYear(),
            monthDate.getMonth(),
            1,
          );
          const startOffset = first.getDay();
          const todayValue = toDateValue(new Date());
          const weekdayLabels = Array.from({ length: 7 }, (_, index) =>
            new Date(2026, 5, 28 + index).toLocaleDateString(locale(), {
              weekday: "short",
            }),
          );
          const days = Array.from({ length: 42 }, (_, index) => {
            const date = new Date(
              first.getFullYear(),
              first.getMonth(),
              index - startOffset + 1,
            );
            const value = toDateValue(date);
            const outside = date.getMonth() !== first.getMonth();
            return `
              <button class="calendar-day ${outside ? "outside" : ""} ${value === todayValue ? "today" : ""} ${value === selectedValue ? "selected" : ""}" type="button" data-date-select="${escapeHtml(value)}" aria-label="${escapeHtml(formatCalendarDateLabel(value))}">
                ${date.getDate()}
              </button>
            `;
          });
          return `
            <div class="calendar-header">
              <button class="icon-button" type="button" data-date-prev aria-label="${escapeHtml(t("previousMonth"))}" style="width: 34px; height: 34px; min-height: 34px;">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <span class="calendar-title">${escapeHtml(
                first.toLocaleDateString(locale(), {
                  month: "long",
                  year: "numeric",
                }),
              )}</span>
              <button class="icon-button" type="button" data-date-next aria-label="${escapeHtml(t("nextMonth"))}" style="width: 34px; height: 34px; min-height: 34px;">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
            <div class="calendar-grid">
              ${weekdayLabels.map((label) => `<span class="calendar-weekday">${escapeHtml(label)}</span>`).join("")}
              ${days.join("")}
            </div>
            <div class="calendar-footer">
              <button class="chip-button" type="button" data-date-clear>${escapeHtml(t("clearDate"))}</button>
            </div>
          `;
        };

        const updateDatePicker = (picker, monthDate = null) => {
          if (!picker) return;
          const hiddenInput = picker.querySelector("input[name='dueDate']");
          const popover = picker.querySelector("[data-date-popover]");
          const label = picker.querySelector("[data-date-label]");
          const selectedValue = hiddenInput?.value || "";
          const nextMonth =
            monthDate ||
            parseMonthValue(picker.dataset.month) ||
            parseDate(selectedValue) ||
            new Date();
          picker.dataset.month = toMonthValue(nextMonth);
          if (popover) {
            popover.innerHTML = renderDatePickerCalendar(
              nextMonth,
              selectedValue,
            );
          }
          if (label) {
            label.textContent = formatCalendarDateLabel(selectedValue);
          }
        };

        const closeDatePickers = (except = null) => {
          document.querySelectorAll("[data-date-picker]").forEach((picker) => {
            if (picker === except) return;
            picker
              .querySelector("[data-date-popover]")
              ?.classList.add("hidden");
            picker
              .querySelector("[data-date-toggle]")
              ?.setAttribute("aria-expanded", "false");
          });
        };

        const toggleDatePicker = (picker) => {
          if (!picker) return;
          const popover = picker.querySelector("[data-date-popover]");
          const trigger = picker.querySelector("[data-date-toggle]");
          if (!popover || !trigger) return;
          const shouldOpen = popover.classList.contains("hidden");
          closeDatePickers(picker);
          popover.classList.toggle("hidden", !shouldOpen);
          trigger.setAttribute("aria-expanded", String(shouldOpen));
        };

        const shiftDatePickerMonth = (picker, direction) => {
          const current =
            parseMonthValue(picker?.dataset.month) ||
            parseDate(picker?.querySelector("input[name='dueDate']")?.value) ||
            new Date();
          updateDatePicker(
            picker,
            new Date(current.getFullYear(), current.getMonth() + direction, 1),
          );
        };

        const setDatePickerValue = (picker, value) => {
          const hiddenInput = picker?.querySelector("input[name='dueDate']");
          if (!hiddenInput) return;
          hiddenInput.value = value;
          updateDatePicker(
            picker,
            parseDate(value) || parseMonthValue(picker.dataset.month),
          );
          closeDatePickers();
        };

        const taskForm = (task = {}, nodeContext = "") => {

          return `

              <button class="secondary-button" type="button" data-modal-close="__MODAL__">${escapeHtml(t("cancel"))}</button>

        const openConfirmModal = ({ message, onConfirm }) => {
          openModal({
            title: t("confirmDeleteTitle"),
            body: `<p class="view-subtitle">${escapeHtml(message)}</p>`,
            footer: `
              <button class="secondary-button" type="button" data-modal-close="__MODAL__">${escapeHtml(t("cancel"))}</button>
              <button class="danger-button" type="button" data-confirm-action>${escapeHtml(t("delete"))}</button>
            `,
            onMount: (layer, modalId) => {
              layer
                .querySelector("[data-modal-close='__MODAL__']")
                ?.setAttribute("data-modal-close", modalId);
              layer
                .querySelector("[data-confirm-action]")

                  await onConfirm();
                  closeModal(modalId);
                });
            },
          });
        };

        const openSearchModal = () => {
          const body = `
            <div class="form-grid">
              <div class="field">
                <label for="globalSearch">${escapeHtml(t("searchEverything"))}</label>
                <input class="input" id="globalSearch" type="search" placeholder="${escapeHtml(t("searchPlaceholder"))}" autofocus />
              </div>
              <div>
                <h3 class="section-title" style="margin-bottom: 8px;">${escapeHtml(t("results"))}</h3>
                <div class="activity-list" id="globalSearchResults"><div class="row-meta">${escapeHtml(t("noResults"))}</div></div>
              </div>
            </div>
          `;
          openModal({
            title: t("search"),
            body,
            width: "720px",
            onMount: (layer) => {
              const input = layer.querySelector("#globalSearch");
              const results = layer.querySelector("#globalSearchResults");
              const renderResults = () => {
                const query = input.value.trim().toLowerCase();
                if (!query) {
                  results.innerHTML = `<div class="row-meta">${escapeHtml(t("noResults"))}</div>`;
                  return;
                }
                const matches = [
                  ...state.workflows.map((workflow) => ({
                    type: "workflow",
                    id: workflow.id,
                    title: workflow.name,
                    body: workflow.description,
                  })),
                  ...state.nodes.map((node) => ({
                    type: "node",
                    id: node.id,
                    workflowId: node.workflowId,
                    title: node.title,
                    body: node.notes,
                  })),
                  ...state.tasks.map((task) => ({
                    type: "task",
                    id: task.id,
                    workflowId: task.workflowId,
                    title: task.title,
                    body: task.description,
                  })),
                ]
                  .filter((item) =>
                    `${item.title} ${item.body}`.toLowerCase().includes(query),

                  .slice(0, 20);
                results.innerHTML = matches.length
                  ? matches
                      .map(
                        (item) => `
                  <article class="activity-row">
                    <strong class="row-title">${escapeHtml(item.title || t("untitled"))}</strong>
                    <span class="row-meta">${escapeHtml(t(item.type))}</span>
                    <button class="chip-button" type="button" data-open-result="${escapeHtml(item.type)}" data-result-id="${escapeHtml(item.id)}" data-workflow-id="${escapeHtml(item.workflowId || item.id)}">${escapeHtml(t("open"))}</button>
                  </article>
                `,
                      )
                      .join("")
                  : `<div class="row-meta">${escapeHtml(t("noResults"))}</div>`;

              input.addEventListener("input", renderResults);
              input.focus();

          showToast("info", t("search"), t("searchOpened"));

        const openStackDemo = () => {
          openModal({
            title: `${t("modalStackTitle")} ${state.modals.length + 1}`,
            body: `<p class="view-subtitle">${escapeHtml(t("modalStackBody"))}</p>`,
            footer: `
              <button class="secondary-button" type="button" data-modal-close="__MODAL__">${escapeHtml(t("close"))}</button>
              <button class="primary-button" type="button" data-action="open-stack-demo">${escapeHtml(t("openAnother"))}</button>
            `,
            onMount: (layer, modalId) => {
              layer
                .querySelector("[data-modal-close='__MODAL__']")
                ?.setAttribute("data-modal-close", modalId);
            },
          });
          showToast("info", t("stack"), t("stackOpened"));
        };

        const exportData = async () => {
          const payload = {
            app: "Munetios Workflow BETA",
            version: 1,
            exportedAt: now(),
            workflows: state.workflows,
            nodes: state.nodes,
            tasks: state.tasks,
            settings: state.settings,
          };
          const text = JSON.stringify(payload, null, 2);
          await navigator.clipboard?.writeText(text).catch(() => null);
          const blob = new Blob([text], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = `munetios-workflow-${new Date().toISOString().slice(0, 10)}.json`;
          anchor.click();
          URL.revokeObjectURL(url);
          showToast("success", t("exported"), t("dataExported"));
        };

        const openImportModal = () => {
          openModal({
            title: t("importJson"),
            body: `
              <form id="importForm" class="form-grid">
                <div class="field">
                  <label for="importJson">${escapeHtml(t("pasteJson"))}</label>
                  <textarea class="textarea" id="importJson" name="json" required style="min-height: 240px;"></textarea>
                </div>
                <div class="field">
                  <label for="importMode">${escapeHtml(t("importMode"))}</label>
                  <select class="select" id="importMode" name="mode">
                    <option value="merge">${escapeHtml(t("mergeData"))}</option>
                    <option value="replace">${escapeHtml(t("replaceAll"))}</option>
                  </select>
                </div>
              </form>
            `,
            footer: `
              <button class="secondary-button" type="button" data-modal-close="__MODAL__">${escapeHtml(t("cancel"))}</button>
              <button class="primary-button" type="submit" form="importForm">${escapeHtml(t("import"))}</button>
            `,
            onMount: (layer, modalId) => {
              layer
                .querySelector("[data-modal-close='__MODAL__']")
                ?.setAttribute("data-modal-close", modalId);
              layer
                .querySelector("#importForm")
                .addEventListener("submit", async (event) => {
                  event.preventDefault();
                  const data = new FormData(event.currentTarget);
                  try {
                    const payload = JSON.parse(String(data.get("json") || ""));
                    await importData(
                      payload,
                      String(data.get("mode") || "merge"),
                    );
                    closeModal(modalId);
                    showToast("success", t("imported"), t("dataImported"));
                  } catch (error) {
                    showToast("error", t("error"), t("importInvalid"));
                  }
                });
            },
          });
        };

        const importData = async (payload, mode) => {
          if (
            !payload ||
            !Array.isArray(payload.workflows) ||
            !Array.isArray(payload.nodes) ||
            !Array.isArray(payload.tasks)
          ) {
            throw new Error("Invalid import");
          }
          const stamp = now();
          const workflows = payload.workflows.map((workflow) => ({
            id: String(workflow.id || uid()),
            name: String(workflow.name || t("untitled")),
            description: String(workflow.description || ""),
            status: statusOptions.workflow.includes(workflow.status)
              ? workflow.status
              : "planning",
            color: String(workflow.color || nodeColors[0]),
            createdAt: workflow.createdAt || stamp,
            updatedAt: workflow.updatedAt || stamp,
          }));
          const workflowIds = new Set(workflows.map((workflow) => workflow.id));
          const nodes = payload.nodes
            .filter((node) => workflowIds.has(node.workflowId))
            .map((node) => ({
              id: String(node.id || uid()),
              workflowId: String(node.workflowId),
              parentId: String(node.parentId || ""),
              title: String(node.title || t("untitled")),
              notes: String(node.notes || ""),
              status: statusOptions.node.includes(node.status)
                ? node.status
                : "idea",
              color: String(node.color || nodeColors[0]),
              x: Number(node.x) || 80,
              y: Number(node.y) || 80,
              createdAt: node.createdAt || stamp,
              updatedAt: node.updatedAt || stamp,
            }));
          const nodeIds = new Set(nodes.map((node) => node.id));
          const tasks = payload.tasks
            .filter((task) => workflowIds.has(task.workflowId))
            .map((task) => ({
              id: String(task.id || uid()),
              workflowId: String(task.workflowId),
              nodeId: nodeIds.has(task.nodeId) ? String(task.nodeId) : "",
              title: String(task.title || t("untitled")),
              description: String(task.description || ""),
              status: statusOptions.task.includes(task.status)
                ? task.status
                : "todo",
              priority: statusOptions.priority.includes(task.priority)
                ? task.priority
                : "medium",
              dueDate: String(task.dueDate || ""),
              createdAt: task.createdAt || stamp,
              updatedAt: task.updatedAt || stamp,
            }));

          if (mode === "replace") {
            await clearStores(["workflows", "nodes", "tasks"]);
          }
          await bulkPut("workflows", workflows);
          await bulkPut("nodes", nodes);
          await bulkPut("tasks", tasks);
          state.settings.activeWorkflowId =
            workflows[0]?.id || state.activeWorkflowId;
          await saveSettings();
          await loadData();
          render();
        };

        const deleteWorkflow = async (workflowId) => {
          await bulkDelete(
            "tasks",
            state.tasks
              .filter((task) => task.workflowId === workflowId)
              .map((task) => task.id),
          );
          await bulkDelete(
            "nodes",
            state.nodes
              .filter((node) => node.workflowId === workflowId)
              .map((node) => node.id),
          );
          await deleteRecord("workflows", workflowId);
          if (state.activeWorkflowId === workflowId) {
            state.activeWorkflowId =
              state.workflows.find((workflow) => workflow.id !== workflowId)
                ?.id || null;
            state.settings.activeWorkflowId = state.activeWorkflowId;
            await saveSettings();
          }
          await loadData();
          render();
          showToast("success", t("deleted"), t("workflowDeleted"));
        };

        const duplicateWorkflow = async (workflowId) => {
          const workflow = state.workflows.find(
            (item) => item.id === workflowId,
          );
          if (!workflow) return;
          const timestamp = now();
          const newWorkflowId = uid();
          const nodeMap = new Map();
          const sourceNodes = state.nodes.filter(
            (node) => node.workflowId === workflowId,
          );
          const newNodes = sourceNodes
            .map((node) => {
              const newId = uid();
              nodeMap.set(node.id, newId);
              return {
                ...node,
                id: newId,
                workflowId: newWorkflowId,
                parentId: "",
                x: (Number(node.x) || 0) + 40,
                y: (Number(node.y) || 0) + 40,
                createdAt: timestamp,
                updatedAt: timestamp,
              };
            })
            .map((node, index) => ({
              ...node,
              parentId: nodeMap.get(sourceNodes[index].parentId) || "",
            }));
          const newTasks = state.tasks
            .filter((task) => task.workflowId === workflowId)
            .map((task) => ({
              ...task,
              id: uid(),
              workflowId: newWorkflowId,
              nodeId: nodeMap.get(task.nodeId) || "",
              createdAt: timestamp,
              updatedAt: timestamp,
            }));
          const created = {
            ...workflow,
            id: newWorkflowId,
            name: `${workflow.name} Copy`,
            createdAt: timestamp,
            updatedAt: timestamp,
          };
          await putRecord("workflows", created);
          await bulkPut("nodes", newNodes);
          await bulkPut("tasks", newTasks);
          state.activeWorkflowId = newWorkflowId;
          state.settings.activeWorkflowId = newWorkflowId;
          await saveSettings();
          await loadData();
          closeTopModal();
          render();
          showToast("success", t("created"), t("workflowDuplicated"));
        };

        const deleteNode = async (nodeId) => {
          const childUpdates = state.nodes
            .filter((node) => node.parentId === nodeId)
            .map((node) => ({ ...node, parentId: "", updatedAt: now() }));
          const taskUpdates = state.tasks
            .filter((task) => task.nodeId === nodeId)
            .map((task) => ({ ...task, nodeId: "", updatedAt: now() }));
          await bulkPut("nodes", childUpdates);
          await bulkPut("tasks", taskUpdates);
          await deleteRecord("nodes", nodeId);
          if (state.selectedNodeId === nodeId) state.selectedNodeId = null;
          await touchWorkflow();
          await loadData();
          closeTopModal();
          render();
          showToast("success", t("deleted"), t("nodeDeleted"));
        };

        const deleteTask = async (taskId) => {
          await deleteRecord("tasks", taskId);
          await touchWorkflow();
          await loadData();
          closeTopModal();
          render();
          showToast("success", t("deleted"), t("taskDeleted"));
        };

        const updateTaskStatus = async (taskId, status) => {
          const task = state.tasks.find((item) => item.id === taskId);
          if (!task) return;
          task.status = status;
          task.updatedAt = now();
          await putRecord("tasks", task);
          await touchWorkflow();
          await loadData();
          render();
          showToast("success", t("updated"), t("taskUpdated"));
        };

        const clearWorkflow = async () => {
          const workflowId = state.activeWorkflowId;
          await bulkDelete(
            "tasks",
            state.tasks
              .filter((task) => task.workflowId === workflowId)
              .map((task) => task.id),
          );
          await bulkDelete(
            "nodes",
            state.nodes
              .filter((node) => node.workflowId === workflowId)
              .map((node) => node.id),
          );
          state.selectedNodeId = null;
          await touchWorkflow();
          await loadData();
          render();
          showToast("success", t("deleted"), t("dataCleared"));
        };

        const clearAllData = async () => {
          await clearStores(["workflows", "nodes", "tasks"]);
          state.activeWorkflowId = null;
          state.selectedNodeId = null;
          state.settings.activeWorkflowId = null;
          await saveSettings();
          await loadData();
          render();
          showToast("success", t("deleted"), t("dataCleared"));
        };

        const applyViewport = () => {
          const viewport = document.getElementById("mindmapViewport");
          if (!viewport) return;
          const { x, y, scale } = state.settings.viewport || {
            x: 0,
            y: 0,
            scale: 1,
          };
          viewport.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
        };

        const drawConnections = () => {
          const svg = document.getElementById("mindmapConnections");
          const stage = document.getElementById("mindmapStage");
          if (!svg || !stage) return;
          const nodes = filteredNodes();
          const visibleIds = new Set(nodes.map((node) => node.id));
          const { x, y, scale } = state.settings.viewport || {
            x: 0,
            y: 0,
            scale: 1,
          };
          svg.setAttribute(
            "viewBox",
            `0 0 ${stage.clientWidth} ${stage.clientHeight}`,
          );
          svg.innerHTML = nodes
            .filter((node) => node.parentId && visibleIds.has(node.parentId))
            .map((node) => {
              const parent = state.nodes.find(
                (item) => item.id === node.parentId,
              );
              if (!parent) return "";
              const startX = x + (Number(parent.x) + NODE_WIDTH / 2) * scale;
              const startY = y + (Number(parent.y) + NODE_HEIGHT / 2) * scale;
              const endX = x + (Number(node.x) + NODE_WIDTH / 2) * scale;
              const endY = y + (Number(node.y) + NODE_HEIGHT / 2) * scale;
              const midX = (startX + endX) / 2;
              return `<path d="M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}" stroke="rgba(244,194,255,.56)" stroke-width="2" fill="none" stroke-linecap="round" />`;
            })
            .join("");
        };

        const resetView = async () => {
          state.settings.viewport = { x: 0, y: 0, scale: 1 };
          await saveSettings();
          applyViewport();
          drawConnections();
          showToast("info", t("overview"), t("viewReset"));
        };

        const fitView = async () => {
          const stage = document.getElementById("mindmapStage");
          const nodes = workflowNodes();
          if (!stage || !nodes.length) return;
          const minX = Math.min(...nodes.map((node) => Number(node.x) || 0));
          const minY = Math.min(...nodes.map((node) => Number(node.y) || 0));
          const maxX = Math.max(
            ...nodes.map((node) => (Number(node.x) || 0) + NODE_WIDTH),
          );
          const maxY = Math.max(
            ...nodes.map((node) => (Number(node.y) || 0) + NODE_HEIGHT),
          );
          const width = Math.max(maxX - minX, NODE_WIDTH);
          const height = Math.max(maxY - minY, NODE_HEIGHT);
          const scale = Math.min(
            1.25,
            Math.max(
              0.45,
              Math.min(
                (stage.clientWidth - 80) / width,
                (stage.clientHeight - 80) / height,
              ),
            ),
          );
          state.settings.viewport = {
            x: Math.round(
              (stage.clientWidth - width * scale) / 2 - minX * scale,
            ),
            y: Math.round(
              (stage.clientHeight - height * scale) / 2 - minY * scale,
            ),
            scale,
          };
          await saveSettings();
          applyViewport();
          drawConnections();
          showToast("info", t("overview"), t("saved"));
        };

        const startNodeDrag = (event, nodeId, targetElement) => {
          const node = state.nodes.find((item) => item.id === nodeId);
          if (!node) return;
          const target =
            targetElement || event.target.closest("[data-node-id]");
          target?.setPointerCapture?.(event.pointerId);
          target?.classList.add("dragging");
          const viewport = state.settings.viewport || { x: 0, y: 0, scale: 1 };
          state.drag = {
            type: "node",
            nodeId,
            pointerId: event.pointerId,
            startClientX: event.clientX,
            startClientY: event.clientY,
            startX: Number(node.x) || 0,
            startY: Number(node.y) || 0,
            scale: viewport.scale || 1,
          };
        };

        const moveNodeDrag = (event) => {
          if (!state.drag || state.drag.type !== "node") return;
          const node = state.nodes.find(
            (item) => item.id === state.drag.nodeId,
          );
          if (!node) return;
          node.x = Math.round(
            state.drag.startX +
              (event.clientX - state.drag.startClientX) / state.drag.scale,
          );
          node.y = Math.round(
            state.drag.startY +
              (event.clientY - state.drag.startClientY) / state.drag.scale,
          );
          const element = document.querySelector(
            `[data-node-id="${CSS.escape(node.id)}"]`,
          );
          if (element) {
            element.style.left = `${node.x}px`;
            element.style.top = `${node.y}px`;
          }
          drawConnections();
        };

        const endNodeDrag = async (event) => {
          if (!state.drag || state.drag.type !== "node") return;
          const node = state.nodes.find(
            (item) => item.id === state.drag.nodeId,
          );
          document
            .querySelector(`[data-node-id="${CSS.escape(state.drag.nodeId)}"]`)
            ?.classList.remove("dragging");
          state.drag = null;
          if (node) {
            node.updatedAt = now();
            await putRecord("nodes", node);
            await touchWorkflow();
            await loadData();
            renderSidebarStats();
            showToast("success", t("saved"), t("nodeMoved"));
          }
          event.preventDefault();
        };

        const handleClick = async (event) => {
          const modalClose = event.target.closest("[data-modal-close]");
          if (modalClose) {
            closeModal(modalClose.dataset.modalClose);
            return;
          }

          const toastClose = event.target.closest("[data-toast-close]");
          if (toastClose) {
            state.toasts = state.toasts.filter(
              (toast) => toast.id !== toastClose.dataset.toastClose,
            );
            renderToasts();
            return;
          }

          const datePicker = event.target.closest("[data-date-picker]");
          const dateToggle = event.target.closest("[data-date-toggle]");
          const datePrevious = event.target.closest("[data-date-prev]");
          const dateNext = event.target.closest("[data-date-next]");
          const dateSelect = event.target.closest("[data-date-select]");
          const dateClear = event.target.closest("[data-date-clear]");

          if (dateToggle) {
            toggleDatePicker(dateToggle.closest("[data-date-picker]"));
            return;
          }

          if (datePrevious) {
            shiftDatePickerMonth(
              datePrevious.closest("[data-date-picker]"),
              -1,
            );
            return;
          }

          if (dateNext) {
            shiftDatePickerMonth(dateNext.closest("[data-date-picker]"), 1);
            return;
          }

          if (dateSelect) {
            setDatePickerValue(
              dateSelect.closest("[data-date-picker]"),
              dateSelect.dataset.dateSelect,
            );
            return;
          }

          if (dateClear) {
            setDatePickerValue(dateClear.closest("[data-date-picker]"), "");
            return;
          }

          if (!datePicker) closeDatePickers();

          const action = event.target.closest("[data-action]")?.dataset.action;
          const viewButton = event.target.closest("[data-view]");
          const workflowId =
            event.target.closest("[data-workflow-id]")?.dataset.workflowId;
          const selectNodeId =
            event.target.closest("[data-select-node]")?.dataset.selectNode;
          const editNodeId =
            event.target.closest("[data-edit-node]")?.dataset.editNode;
          const editTaskId =
            event.target.closest("[data-edit-task]")?.dataset.editTask;
          const taskStatusButton = event.target.closest("[data-task-status]");
          const deleteWorkflowButton = event.target.closest(
            "[data-confirm-delete-workflow]",
          );
          const duplicateWorkflowButton = event.target.closest(
            "[data-duplicate-workflow]",
          );
          const deleteNodeButton = event.target.closest("[data-delete-node]");
          const deleteTaskButton = event.target.closest("[data-delete-task]");
          const resultButton = event.target.closest("[data-open-result]");

          if (workflowId) {
            await setActiveWorkflow(workflowId);
            return;
          }

          if (selectNodeId) {
            state.selectedNodeId = selectNodeId;
            render();
            return;
          }

          if (editNodeId) {
            openNodeModal(state.nodes.find((node) => node.id === editNodeId));
            return;
          }

          if (editTaskId) {
            openTaskModal(state.tasks.find((task) => task.id === editTaskId));
            return;
          }

          if (taskStatusButton) {
            await updateTaskStatus(
              taskStatusButton.dataset.taskStatus,
              taskStatusButton.dataset.status,
            );
            return;
          }

          if (deleteWorkflowButton) {
            const id = deleteWorkflowButton.dataset.confirmDeleteWorkflow;
            openConfirmModal({
              message: t("confirmDeleteWorkflow"),
              onConfirm: () => deleteWorkflow(id),
            });
            return;
          }

          if (duplicateWorkflowButton) {
            await duplicateWorkflow(
              duplicateWorkflowButton.dataset.duplicateWorkflow,
            );
            return;
          }

          if (deleteNodeButton) {
            const id = deleteNodeButton.dataset.deleteNode;
            openConfirmModal({
              message: t("confirmDeleteNode"),
              onConfirm: () => deleteNode(id),
            });
            return;
          }

          if (deleteTaskButton) {
            const id = deleteTaskButton.dataset.deleteTask;
            openConfirmModal({
              message: t("confirmDeleteTask"),
              onConfirm: () => deleteTask(id),
            });
            return;
          }

          if (resultButton) {
            const type = resultButton.dataset.openResult;
            const id = resultButton.dataset.resultId;
            await setActiveWorkflow(resultButton.dataset.workflowId);
            if (type === "node") {
              state.view = "mindmap";
              state.selectedNodeId = id;
            }
            if (type === "task") {
              state.view = "tasks";
            }
            closeTopModal();
            render();
            return;
          }

          if (viewButton) {
            setView(viewButton.dataset.view);
            return;
          }

          if (!action) return;

          if (action === "new-workflow") openWorkflowModal();
          if (action === "edit-workflow") openWorkflowModal(activeWorkflow());
          if (action === "new-node")
            openNodeModal(
              null,
              event.target.closest("[data-node-context]")?.dataset
                .nodeContext || "",
            );
          if (action === "new-task")
            openTaskModal(
              null,
              event.target.closest("[data-node-context]")?.dataset
                .nodeContext ||
                state.selectedNodeId ||
                "",
            );
          if (action === "open-search") openSearchModal();
          if (action === "open-stack-demo") openStackDemo();
          if (action === "reset-view") await resetView();
          if (action === "fit-view") await fitView();
          if (action === "export-json") await exportData();
          if (action === "import-json") openImportModal();
          if (action === "clear-workflow") {
            openConfirmModal({
              message: t("confirmClearWorkflow"),
              onConfirm: clearWorkflow,
            });
          }
          if (action === "clear-all") {
            openConfirmModal({
              message: t("confirmClearAll"),
              onConfirm: clearAllData,
            });
          }
        };

        const handleInput = (event) => {
          const field = event.target.closest("[data-field]");
          if (!field) return;
          if (field.dataset.field === "task-search")
            state.filters.taskSearch = field.value;
          if (field.dataset.field === "node-search")
            state.filters.nodeSearch = field.value;
          clearTimeout(state.autosaveTimer);
          state.autosaveTimer = setTimeout(render, 100);
        };

        const handleChange = async (event) => {
          const tab = event.target.closest(".tab-button");
          if (tab?.dataset.view) {
            setView(tab.dataset.view);
            return;
          }

          if (event.target === el.languageSelect) {
            state.language = normalizeLanguage(event.target.value);
            state.settings.language = state.language;
            await saveSettings();
            render();
            renderModals();
            showToast("success", t("saved"), t("settingsSaved"));
            return;
          }

          const field = event.target.closest("[data-field]");
          if (field) {
            if (field.dataset.field === "task-status")
              state.filters.taskStatus = field.value;
            if (field.dataset.field === "task-sort")
              state.filters.taskSort = field.value;
            render();
            return;
          }

          const setting = event.target.closest("[data-setting]");
          if (setting) {
            state.settings[setting.dataset.setting] = setting.checked;
            await saveSettings();
            render();
            showToast("success", t("saved"), t("settingsSaved"));
          }
        };

        const handlePointerDown = (event) => {
          const nodeEl = event.target.closest("[data-node-id]");
          if (!nodeEl) return;
          state.selectedNodeId = nodeEl.dataset.nodeId;
          startNodeDrag(event, nodeEl.dataset.nodeId, nodeEl);
          renderSidebarStats();
          nodeEl.classList.add("selected");
        };

        const handleKeydown = (event) => {
          if (event.key === "Escape") closeTopModal();
          if (
            (event.ctrlKey || event.metaKey) &&
            event.key.toLowerCase() === "k"
          ) {
            event.preventDefault();
            openSearchModal();
          }
        };

        const attachEvents = () => {
          document.addEventListener("click", handleClick);
          document.addEventListener("input", handleInput);
          document.addEventListener("change", handleChange);
          document.addEventListener("pointerdown", handlePointerDown);
          document.addEventListener("pointermove", moveNodeDrag);
          document.addEventListener("pointerup", endNodeDrag);
          document.addEventListener("pointercancel", endNodeDrag);
          document.addEventListener("keydown", handleKeydown);
          window.addEventListener("resize", drawConnections);
        };

        const init = async () => {
          try {
            state.db = await openDb();
            await loadData();
            attachEvents();
            render();
          } catch (error) {
            console.error(error);
            el.viewRoot.innerHTML = `
              <section class="empty-state liquid-glass">
                <div class="empty-state-content">
                  <h2>${escapeHtml(t("error"))}</h2>
                  <p>We couldn't able to load the workflows right now. Please try again or reload the page.</p>
                </div>
              </section>
            `;
            showToast(
              "error",
              t("error"),
              error?.message ||
                "We couldn't able to load the workflows right now.",
            );
          }
        };

        init();
      })();
    </script>
  </body>
</html>
