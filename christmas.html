<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas</title>
    <link rel="stylesheet" href="https://api.munetios.com/beautiful-css/beautiful.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,100..1000&display=swap">
    <style>
        body {
            font-family: 'Google Sans Flex', sans-serif;
            background-color: #bd1919;
            margin: 0;
            padding: 0;
        }
       .topbar {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .right-how-many-christmas-left {
            font-size: 18px;
            color: white;
        }
        .right-how-many-christmas-left {
            padding: 10px 15px;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="right-how-many-christmas-left liquid-glass">
            <span id="countMoreDaysUntilChristmas"></span>
        </div>
    </div> 
    <div class="content">
        <div class="game">
            <canvas id="game" width="800" height="600"></canvas>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        const snowflakes = [];
        const presents = [];
        let score = 0;
        let gameOver = false;

        // Player (Santa)
        const santa = {
            x: canvas.width / 2 - 40,
            y: canvas.height - 100,
            width: 80,
            height: 80,
            speed: 7,
            dx: 0
        };

        // Draw Santa as SVG directly on canvas
        function drawSanta() {
            // Santa's face
            ctx.save();
            ctx.beginPath();
            ctx.arc(santa.x + santa.width / 2, santa.y + santa.height / 2, santa.width / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
        
            // Head
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(santa.x + santa.width / 2, santa.y + santa.height / 2, santa.width / 2 - 8, 0, Math.PI * 2);
            ctx.fill();
        
            // Hat base
            ctx.fillStyle = "#bd1919";
            ctx.fillRect(santa.x + santa.width / 2 - 28, santa.y + santa.height / 2 - 40, 56, 20);
        
            // Hat top
            ctx.beginPath();
            ctx.moveTo(santa.x + santa.width / 2, santa.y + santa.height / 2 - 40);
            ctx.lineTo(santa.x + santa.width / 2 + 20, santa.y + santa.height / 2 - 60);
            ctx.lineTo(santa.x + santa.width / 2 - 20, santa.y + santa.height / 2 - 60);
            ctx.closePath();
            ctx.fillStyle = "#bd1919";
            ctx.fill();
        
            // Hat pompom
            ctx.beginPath();
            ctx.arc(santa.x + santa.width / 2, santa.y + santa.height / 2 - 62, 8, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
        
            // Eyes
            ctx.fillStyle = "#222";
            ctx.beginPath();
            ctx.arc(santa.x + santa.width / 2 - 12, santa.y + santa.height / 2 - 8, 4, 0, Math.PI * 2);
            ctx.arc(santa.x + santa.width / 2 + 12, santa.y + santa.height / 2 - 8, 4, 0, Math.PI * 2);
            ctx.fill();
        
            // Nose
            ctx.beginPath();
            ctx.arc(santa.x + santa.width / 2, santa.y + santa.height / 2 + 2, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#f7b07b";
            ctx.fill();
        
            // Beard
            ctx.beginPath();
            ctx.arc(santa.x + santa.width / 2, santa.y + santa.height / 2 + 24, 18, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
        
            ctx.restore();
        }

        // Snowflake
        function createSnowflake() {
            const x = Math.random() * canvas.width;
            const size = Math.random() * 5 + 2;
            const speed = Math.random() * 2 + 1;
            snowflakes.push({ x, y: -size, size, speed });
        }

        function drawSnowflakes() {
            ctx.fillStyle = 'white';
            snowflakes.forEach(flake => {
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function updateSnowflakes() {
            snowflakes.forEach(flake => {
                flake.y += flake.speed;
            });
            // Remove off-screen
            for (let i = snowflakes.length - 1; i >= 0; i--) {
                if (snowflakes[i].y > canvas.height) snowflakes.splice(i, 1);
            }
        }

        // Presents
        function createPresent() {
            const x = Math.random() * (canvas.width - 30);
            presents.push({ x, y: -30, width: 30, height: 30, speed: 3 });
        }

        function drawPresents() {
            presents.forEach(present => {
                ctx.fillStyle = '#2ecc40';
                ctx.fillRect(present.x, present.y, present.width, present.height);
                ctx.fillStyle = '#ffdc00';
                ctx.fillRect(present.x + 12, present.y, 6, present.height);
                ctx.fillRect(present.x, present.y + 12, present.width, 6);
            });
        }

        function updatePresents() {
            presents.forEach(present => {
                present.y += present.speed;
            });
            // Remove off-screen
            for (let i = presents.length - 1; i >= 0; i--) {
                if (presents[i].y > canvas.height) presents.splice(i, 1);
            }
        }

        // Collision
        function isColliding(a, b) {
            return (
                a.x < b.x + b.width &&
                a.x + a.width > b.x &&
                a.y < b.y + b.height &&
                a.y + a.height > b.y
            );
        }

        function checkCollisions() {
            for (let i = presents.length - 1; i >= 0; i--) {
                if (isColliding(santa, presents[i])) {
                    score++;
                    presents.splice(i, 1);
                }
            }
        }

        // Game loop
        function drawScore() {
            ctx.font = '28px Google Sans Flex, sans-serif';
            ctx.fillStyle = 'white';
            ctx.fillText(`Score: ${score}`, 20, 40);
        }

        function drawGameOver() {
            ctx.font = '48px Google Sans Flex, sans-serif';
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2);
            ctx.font = '32px Google Sans Flex, sans-serif';
            ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 50);
        }

        function updateSanta() {
            santa.x += santa.dx;
            if (santa.x < 0) santa.x = 0;
            if (santa.x + santa.width > canvas.width) santa.x = canvas.width - santa.width;
        }

        function clear() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function loop() {
            if (gameOver) {
                drawGameOver();
                return;
            }
            clear();
            drawSnowflakes();
            drawPresents();
            drawSanta();
            drawScore();
            updateSnowflakes();
            updatePresents();
            updateSanta();
            checkCollisions();

            // End game if missed present
            for (let i = 0; i < presents.length; i++) {
                if (presents[i].y > canvas.height - 10) {
                    gameOver = true;
                }
            }

            requestAnimationFrame(loop);
        }

        // Controls
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') santa.dx = -santa.speed;
            if (e.key === 'ArrowRight') santa.dx = santa.speed;
        });
        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') santa.dx = 0;
        });

        // Spawn snowflakes and presents
        setInterval(createSnowflake, 100);
        setInterval(createPresent, 1200);

        // Start game
        loop();

        // Music
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let melodyNotes = [
            { freq: 523.25, dur: 0.3 }, // C
            { freq: 659.25, dur: 0.3 }, // E
            { freq: 783.99, dur: 0.3 }, // G
            { freq: 1046.5, dur: 0.3 }, // C
            { freq: 880, dur: 0.3 },    // A
            { freq: 783.99, dur: 0.3 }, // G
            { freq: 659.25, dur: 0.3 }, // E
            { freq: 523.25, dur: 0.3 }  // C
        ];

        function playNote(freq, duration, time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.1, time);
            gain.gain.linearRampToValueAtTime(0, time + duration);
            osc.start(time);
            osc.stop(time + duration);
        }

        function playMelody() {
            let now = audioCtx.currentTime;
            melodyNotes.forEach(note => {
                playNote(note.freq, note.dur, now);
                now += note.dur;
            });
        }

        // Start music on user interaction
        canvas.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playMelody();
        });
        function updateDaysUntilChristmas() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const christmasDate = new Date(currentYear, 11, 25); // December is month 11
            if (now > christmasDate) {
                christmasDate.setFullYear(currentYear + 1);
            }
            const diffTime = christmasDate - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            document.getElementById('countMoreDaysUntilChristmas').textContent = `${diffDays} day${diffDays !== 1 ? 's' : ''} until Christmas!`;
        }
        updateDaysUntilChristmas();
    </script>
</body>
</html>
