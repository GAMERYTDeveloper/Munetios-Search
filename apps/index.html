<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Munetios App Launcher</title>
    <link
      rel="stylesheet"
      href="https://api.munetios.com/beautiful-css/beautiful.css"
    />
    <style>
      :root {
        --bg: #12001f;
        --bg-deep: #090010;
        --panel: rgba(47, 5, 76, 0.58);
        --panel-strong: rgba(69, 12, 111, 0.7);
        --panel-soft: rgba(255, 255, 255, 0.08);
        --text: #fff8ff;
        --muted: rgba(255, 248, 255, 0.68);
        --line: rgba(255, 255, 255, 0.13);
        --purple: #a855f7;
        --purple-strong: #7e22ce;
        --purple-dark: #3b025c;
        --shadow: 0 18px 48px rgba(5, 0, 10, 0.46);
        --radius: 25px;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg-deep);
      }

      body,
      button,
      input,
      select,
      textarea {
        font-family: "Google Sans Flex", "Google Sans", Arial, sans-serif;
        font-variation-settings:
          "wght" 480,
          "GRAD" 30,
          "ROND" 80,
          "opsz" 18;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(
            circle at 16% 0%,
            rgba(168, 85, 247, 0.28),
            transparent 30rem
          ),
          radial-gradient(
            circle at 92% 14%,
            rgba(88, 28, 135, 0.34),
            transparent 28rem
          ),
          linear-gradient(145deg, #0c0015 0%, #1d0035 48%, #090010 100%);
        overflow-x: hidden;
        animation: pageEnter 420ms var(--ease) both;
      }

      body.in-frame {
        min-height: auto;
        background:
          linear-gradient(145deg, rgba(12, 0, 21, 0.94), rgba(29, 0, 53, 0.92)),
          var(--bg-deep);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input {
        border: 0;
      }

      button {
        cursor: pointer;
      }

      .launcher-shell {
        width: min(100%, 760px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 14px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0 14px;
        background: transparent;
        animation: slideDown 420ms var(--ease) both;
      }

      .topbar-left,
      .launcher-actions,
      .search-wrap,
      .filter-chip,
      .app-card,
      .context-menu {
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .liquid-glass {
        background: rgba(32, 4, 54, 0.62);
        -webkit-backdrop-filter: blur(3px) saturate(135%);
        backdrop-filter: blur(3px) saturate(135%);
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 9px 11px;
        border-radius: var(--radius);
      }

      .brand-mark {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        border-radius: var(--radius);
        background: linear-gradient(145deg, #9d4edd, #3b025c);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }

      .brand-mark img {
        width: 24px;
        height: 24px;
        border-radius: 6px;
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-title {
        margin: 0;
        font-size: 0.98rem;
        line-height: 1.1;
        font-weight: 720;
        white-space: nowrap;
      }

      .brand-subtitle {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 0.75rem;
        white-space: nowrap;
      }

      .launcher-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px;
        border-radius: var(--radius);
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: var(--radius);
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        transition:
          transform 160ms ease,
          background 160ms ease;
      }

      .icon-button:hover {
        transform: translateY(-1px);
        background: rgba(168, 85, 247, 0.32);
      }

      .material-symbols-rounded {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: "Material Symbols Rounded", "Google Sans Flex", sans-serif;
        font-size: 1.25rem;
        font-style: normal;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0;
        text-transform: none;
        white-space: nowrap;
        direction: ltr;
        font-feature-settings: "liga";
        -webkit-font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
      }

      .search-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin: 2px 0 12px;
        padding: 12px 14px;
        border-radius: var(--radius);
      }

      .search-wrap input {
        width: 100%;
        min-width: 0;
        color: var(--text);
        background: transparent;
        outline: none;
        font-size: 1rem;
      }

      .search-wrap input::placeholder {
        color: rgba(255, 248, 255, 0.56);
      }

      .filter-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .filter-row::-webkit-scrollbar {
        display: none;
      }

      .filter-chip {
        flex: 0 0 auto;
        padding: 8px 11px;
        border-radius: var(--radius);
        color: var(--muted);
        background: rgba(255, 255, 255, 0.06);
        font-size: 0.8rem;
        transition:
          transform 160ms ease,
          color 160ms ease,
          background 160ms ease;
      }

      .filter-chip:hover {
        transform: translateY(-1px);
      }

      .filter-chip[aria-pressed="true"] {
        color: #fff;
        background: rgba(126, 34, 206, 0.58);
      }

      .section {
        margin-top: 14px;
        animation: sectionEnter 420ms var(--ease) both;
      }

      .section-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        padding: 0 2px 9px;
      }

      .section-title {
        margin: 0;
        font-size: 0.86rem;
        font-weight: 700;
        letter-spacing: 0;
      }

      .section-count {
        color: var(--muted);
        font-size: 0.75rem;
      }

      .apps-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
        gap: 10px;
        min-height: 94px;
        padding: 10px;
        border-radius: var(--radius);
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
      }

      .apps-grid:empty::before {
        content: "Drop apps here";
        display: grid;
        place-items: center;
        min-height: 74px;
        color: rgba(255, 248, 255, 0.42);
        font-size: 0.82rem;
        border: 1px dashed rgba(255, 255, 255, 0.18);
        border-radius: var(--radius);
        grid-column: 1 / -1;
      }

      .app-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 112px;
        padding: 12px 8px 10px;
        border-radius: var(--radius);
        color: #fff;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.12),
            rgba(255, 255, 255, 0.04)
          ),
          rgba(59, 2, 92, 0.72);
        text-align: center;
        transition:
          transform 170ms ease,
          border-color 170ms ease,
          background 170ms ease;
        user-select: none;
        animation: cardEnter 360ms var(--ease) both;
        animation-delay: calc(min(var(--card-index, 0), 12) * 24ms);
      }

      .app-card:hover,
      .app-card:focus-within {
        transform: translateY(-2px);
        border-color: rgba(216, 180, 254, 0.42);
        background:
          linear-gradient(
            180deg,
            rgba(168, 85, 247, 0.26),
            rgba(255, 255, 255, 0.06)
          ),
          rgba(59, 2, 92, 0.82);
      }

      .app-card.dragging {
        opacity: 0.46;
        transform: scale(0.96);
      }

      .app-card.hidden,
      .section.hidden {
        display: none;
      }

      .app-card.custom-app::after {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px solid rgba(216, 180, 254, 0.18);
        border-radius: 18px;
        pointer-events: none;
      }

      .icon-frame {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        margin-bottom: 9px;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      }

      .icon-frame img {
        max-width: 50px;
        max-height: 50px;
        width: auto;
        height: auto;
        border-radius: 7px;
        object-fit: contain;
      }

      .icon-frame .material-symbols-rounded {
        color: #ffffff;
        font-size: 2.4rem;
      }

      .app-name {
        display: -webkit-box;
        min-height: 2.3em;
        max-width: 100%;
        overflow: hidden;
        color: #fff;
        font-size: 0.78rem;
        font-weight: 650;
        line-height: 1.15;
        overflow-wrap: normal;
        word-break: keep-all;
        hyphens: none;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .soon-badge {
        position: absolute;
        top: 7px;
        right: 7px;
        padding: 3px 6px;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.88);
        background: rgba(12, 0, 21, 0.58);
        font-size: 0.62rem;
        font-weight: 700;
      }

      .empty-state {
        display: none;
        padding: 28px 14px;
        color: var(--muted);
        text-align: center;
      }

      .empty-state.visible {
        display: block;
      }

      .context-menu {
        position: fixed;
        z-index: 1000;
        min-width: 190px;
        padding: 6px;
        border-radius: var(--radius);
        color: var(--text);
      }

      .context-menu button {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
        border-radius: 7px;
        color: inherit;
        background: transparent;
        text-align: left;
        font-size: 0.88rem;
      }

      .context-menu button:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 900;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(7, 0, 12, 0.58);
        animation: fadeIn 180ms ease both;
      }

      .modal-backdrop.visible {
        display: flex;
      }

      .custom-app-modal {
        width: min(100%, 420px);
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        animation: modalEnter 260ms var(--ease) both;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .modal-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 720;
      }

      .custom-app-form {
        display: grid;
        gap: 12px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .field input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: var(--radius);
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        outline: none;
      }

      .field input:focus {
        border-color: rgba(216, 180, 254, 0.58);
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 4px;
      }

      .text-button,
      .primary-button {
        min-height: 38px;
        padding: 0 13px;
        border-radius: var(--radius);
        color: var(--text);
        font-weight: 680;
      }

      .text-button {
        background: rgba(255, 255, 255, 0.08);
      }

      .primary-button {
        background: linear-gradient(145deg, #9333ea, #581c87);
      }

      .footer {
        padding: 18px 0 8px;
        color: rgba(255, 248, 255, 0.46);
        text-align: center;
        font-size: 0.75rem;
      }

      .footer a {
        color: rgba(255, 248, 255, 0.58);
      }

      @keyframes sectionEnter {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes cardEnter {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes modalEnter {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
        }
      }

      @media (min-width: 620px) {
        .launcher-shell {
          padding: 18px;
        }

        .apps-grid {
          grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
          gap: 12px;
          padding: 12px;
        }

        .app-card {
          min-height: 122px;
        }

        .icon-frame {
          width: 64px;
          height: 64px;
        }

        .icon-frame img {
          max-width: 56px;
          max-height: 56px;
        }
      }

      @media (max-width: 430px) {
        .launcher-shell {
          padding: 10px;
        }

        .topbar {
          align-items: stretch;
        }

        .brand-subtitle {
          display: none;
        }

        .launcher-actions {
          flex: 0 0 auto;
        }

        .apps-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 8px;
          padding: 8px;
        }

        .app-card {
          min-height: 104px;
          padding-inline: 6px;
        }

        .app-name {
          font-size: 0.72rem;
        }
      }
    </style>
    <script src="/languages/language.js" defer></script>
  </head>
  <body>
    <main class="launcher-shell" aria-label="Munetios App Launcher">
      <header class="topbar">
        <div class="topbar-left liquid-glass">
          <span class="brand-mark" aria-hidden="true">
            <img
              src="https://www.munetios.com/apple-touch-icon-new.png"
              alt=""
            />
          </span>
          <div class="brand-copy">
            <h1 class="brand-title">Munetios Apps</h1>
            <p class="brand-subtitle" id="launcherStats">Loading apps</p>
          </div>
        </div>
        <div
          class="launcher-actions liquid-glass"
          aria-label="Launcher controls"
        >
          <button
            class="icon-button"
            id="addCustomApp"
            type="button"
            title="Add Custom App"
            aria-label="Add Custom App"
          >
            <span class="material-symbols-rounded" aria-hidden="true"
              >add_circle</span
            >
          </button>
          <button
            class="icon-button"
            id="resetLauncher"
            type="button"
            title="Reset launcher"
            aria-label="Reset launcher"
          >
            <span class="material-symbols-rounded" aria-hidden="true"
              >restart_alt</span
            >
          </button>
        </div>
      </header>

      <label class="search-wrap liquid-glass" for="searchApps">
        <span class="material-symbols-rounded" aria-hidden="true">search</span>
        <input
          id="searchApps"
          type="search"
          autocomplete="off"
          placeholder="Search apps"
        />
      </label>

      <nav class="filter-row" aria-label="App groups">
        <button
          class="filter-chip liquid-glass"
          type="button"
          data-filter="all"
          aria-pressed="true"
        >
          All
        </button>
        <button
          class="filter-chip liquid-glass"
          type="button"
          data-filter="core"
          aria-pressed="false"
        >
          Core
        </button>
        <button
          class="filter-chip liquid-glass"
          type="button"
          data-filter="create"
          aria-pressed="false"
        >
          Create
        </button>
        <button
          class="filter-chip liquid-glass"
          type="button"
          data-filter="life"
          aria-pressed="false"
        >
          Daily
        </button>
        <button
          class="filter-chip liquid-glass"
          type="button"
          data-filter="more"
          aria-pressed="false"
        >
          More
        </button>
      </nav>

      <div id="sections"></div>
      <p class="empty-state" id="emptyState">No apps match this search.</p>

      <div class="modal-backdrop" id="customAppBackdrop" aria-hidden="true">
        <section
          class="custom-app-modal liquid-glass"
          role="dialog"
          aria-modal="true"
          aria-labelledby="customAppTitle"
        >
          <div class="modal-header">
            <h2 class="modal-title" id="customAppTitle">Add Custom App</h2>
            <button
              class="icon-button"
              id="closeCustomApp"
              type="button"
              title="Close Custom App Form"
              aria-label="Close Custom App Form"
            >
              <span class="material-symbols-rounded" aria-hidden="true"
                >close</span
              >
            </button>
          </div>
          <form class="custom-app-form" id="customAppForm">
            <label class="field">
              <span id="customNameLabel">Application Name</span>
              <input
                id="customAppName"
                name="name"
                type="text"
                autocomplete="off"
                required
              />
            </label>
            <label class="field">
              <span id="customUrlLabel">Application Link</span>
              <input
                id="customAppUrl"
                name="url"
                type="text"
                autocomplete="off"
                required
              />
            </label>
            <label class="field">
              <span id="customIconLabel">Icon Link</span>
              <input
                id="customAppIcon"
                name="icon"
                type="text"
                autocomplete="off"
              />
            </label>
            <div class="modal-actions">
              <button class="text-button" id="cancelCustomApp" type="button">
                Cancel Custom App
              </button>
              <button class="primary-button" id="saveCustomApp" type="submit">
                Save Custom App
              </button>
            </div>
          </form>
        </section>
      </div>

      <footer class="footer">
        &copy; 2026 Munetios&trade;.
        <span style="display: none" id="rightsText">All rights reserved.</span>
        <br />
        <a href="https://www.munetios.com/policies/#/terms" id="termsLink"
          >Terms</a
        >
        |
        <a href="https://www.munetios.com/policies/#/privacy" id="privacyLink"
          >Privacy</a
        >
      </footer>
    </main>

      function getStoredJson(key, fallback) {
        try {
          return JSON.parse(localStorage.getItem(key)) ?? fallback;
        } catch {
          return fallback;
        }
      }

      function getLanguage() {
        const storedLanguage = (
          localStorage.getItem(STORAGE_KEYS.language) || "en"
        ).toLowerCase();
        const baseLanguage = storedLanguage.split("-")[0];
        if (TRANSLATIONS[storedLanguage]) return storedLanguage;
        return TRANSLATIONS[baseLanguage] ? baseLanguage : "en";
      }

      function t(key) {
        const language = getLanguage();
        return TRANSLATIONS[language][key] || TRANSLATIONS.en[key] || key;
      }

      function translateSection(sectionId) {
        const language = getLanguage();
        return (
          TRANSLATIONS[language].sections?.[sectionId] ||
          TRANSLATIONS.en.sections[sectionId] ||
          sectionId
        );
      }

      function translateApp(app) {
        const language = getLanguage();
        return (
          TRANSLATIONS[language].apps?.[app.id] ||
          TRANSLATIONS.en.apps?.[app.id] ||
          app.name
        );
      }

      function getCustomApps() {
        return getStoredJson(STORAGE_KEYS.customApps, []);
      }

      function saveCustomApps(customApps) {
        localStorage.setItem(
          STORAGE_KEYS.customApps,
          JSON.stringify(customApps),
        );
      }

      function normalizeUrl(url) {
        const trimmed = url.trim();
        if (!trimmed) return "";
        if (/^https?:\/\//i.test(trimmed)) return trimmed;
        return `https://${trimmed}`;
      }

      function getAllApps() {
        const customApps = getCustomApps().map((app) => ({
          id: app.id,
          name: app.name,
          href: app.href,
          icon: app.icon || "https://www.munetios.com/apple-touch-icon-new.png",
          group: app.group || "more",
          live: true,
          custom: true,
        }));
        return [...apps, ...customApps];
      }

      function syncAppMap() {
        appById = new Map(getAllApps().map((app) => [app.id, app]));
      }

      function getHiddenApps() {
        return getStoredJson(STORAGE_KEYS.hidden, {});
      }

      function saveHiddenApps(hidden) {
        localStorage.setItem(STORAGE_KEYS.hidden, JSON.stringify(hidden));
      }

      function createSection(section) {
        const wrapper = document.createElement("section");
        wrapper.className = "section";
        wrapper.dataset.section = section.id;

        const header = document.createElement("div");
        header.className = "section-header";

        const title = document.createElement("h2");
        title.className = "section-title";
        title.textContent = translateSection(section.id);

        const count = document.createElement("span");
        count.className = "section-count";
        count.dataset.countFor = section.id;

        const grid = document.createElement("div");
        grid.className = "apps-grid liquid-glass";
        grid.dataset.grid = section.id;

        header.append(title, count);
        wrapper.append(header, grid);
        return wrapper;
      }

      function createCard(app) {
        const card = document.createElement("article");
        card.className = "app-card liquid-glass";
        if (app.custom) card.classList.add("custom-app");
        card.dataset.appId = app.id;
        card.dataset.group = app.group;
        card.dataset.live = String(app.live);
        card.draggable = true;
        card.tabIndex = 0;
        card.setAttribute(
          "aria-label",
          app.live ? translateApp(app) : `${translateApp(app)}, coming soon`,
        );

        const iconFrame = document.createElement("span");
        iconFrame.className = "icon-frame";
        iconFrame.setAttribute("aria-hidden", "true");

        let icon;
        if (app.symbol) {
          icon = document.createElement("span");
          icon.className = "material-symbols-rounded";
          icon.textContent = app.symbol;
        } else {
          icon = document.createElement("img");
          icon.src = app.icon;
          icon.alt = "";
          icon.loading = "lazy";
          icon.decoding = "async";
        }

        const name = document.createElement("a");
        name.className = "app-name";
        name.href = app.href;
        name.target = "_top";
        name.rel = "noopener";
        name.textContent = translateApp(app);

        iconFrame.append(icon);
        card.append(iconFrame, name);

        if (!app.live) {
          const badge = document.createElement("span");
          badge.className = "soon-badge";
          badge.textContent = "Soon";
          card.append(badge);
        }

        return card;
      }

      function defaultOrder() {
        const allApps = getAllApps();
        return sections.map((section) => ({
          section: section.id,
          ids: allApps
            .filter((app) => app.group === section.id)
            .sort((a, b) => Number(b.live) - Number(a.live))
            .map((app) => app.id),
        }));
      }

      function loadOrder() {
        const stored = getStoredJson(STORAGE_KEYS.order, null);
        if (!Array.isArray(stored)) return defaultOrder();

        const seen = new Set();
        const normalized = sections.map((section) => {
          const found = stored.find((item) => item.section === section.id);
          const ids = Array.isArray(found?.ids)
            ? found.ids.filter((id) => {
                if (!appById.has(id) || seen.has(id)) return false;
                seen.add(id);
                return true;
              })
            : [];
          return { section: section.id, ids };
        });

        getAllApps().forEach((app) => {
          if (!seen.has(app.id)) {
            const target = normalized.find(
              (item) => item.section === app.group,
            );
            target.ids.push(app.id);
          }
        });

        return normalized;
      }

      function saveOrder() {
        const order = sections.map((section) => {
          const grid = document.querySelector(`[data-grid="${section.id}"]`);
          return {
            section: section.id,
            ids: Array.from(grid.querySelectorAll(".app-card")).map(
              (card) => card.dataset.appId,
            ),
          };
        });
        localStorage.setItem(STORAGE_KEYS.order, JSON.stringify(order));
      }

      function render() {
        syncAppMap();
        sectionsRoot.innerHTML = "";
        sections.forEach((section) =>
          sectionsRoot.append(createSection(section)),
        );
        loadOrder().forEach(({ section, ids }) => {
          const grid = document.querySelector(`[data-grid="${section}"]`);
          ids.forEach((id) => {
            const app = appById.get(id);
            if (app) {
              const card = createCard(app);
              card.style.setProperty("--card-index", grid.children.length);
              grid.append(card);
            }
          });
        });
        bindCards();
        bindDropZones();
        applyLanguage();
        applyVisibility();
      }

      function openApp(card) {
        const app = appById.get(card.dataset.appId);
        if (!app || !app.live || app.href === "#") return;
        window.open(app.href, "_top", "noopener");
      }

      function bindCards() {
        document.querySelectorAll(".app-card").forEach((card) => {
          card.addEventListener("click", (event) => {
            const app = appById.get(card.dataset.appId);
            if (event.target.closest(".app-name")) {
              if (!app?.live || app.href === "#") {
                event.preventDefault();
              }
              return;
            }
            openApp(card);
          });

          card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openApp(card);
            }
          });

          card.addEventListener("dragstart", (event) => {
            draggedCard = card;
            card.classList.add("dragging");
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", card.dataset.appId);
          });

          card.addEventListener("dragend", () => {
            card.classList.remove("dragging");
            draggedCard = null;
            saveOrder();
            applyVisibility();
          });
        });
      }

      function getDragTarget(grid, x, y) {
        const cards = Array.from(
          grid.querySelectorAll(".app-card:not(.dragging)"),
        );
        return cards.reduce(
          (closest, card) => {
            const rect = card.getBoundingClientRect();
            const offsetY = y - rect.top - rect.height / 2;
            const offsetX = x - rect.left - rect.width / 2;
            const offset =
              Math.abs(offsetY) > Math.abs(offsetX) ? offsetY : offsetX;
            if (offset < 0 && offset > closest.offset) {
              return { offset, element: card };
            }
            return closest;
          },
          { offset: -Infinity, element: null },
        ).element;
      }

      function bindDropZones() {
        document.querySelectorAll(".apps-grid").forEach((grid) => {
          grid.addEventListener("dragover", (event) => {
            event.preventDefault();
            if (!draggedCard) return;
            const target = getDragTarget(grid, event.clientX, event.clientY);
            if (target) {
              grid.insertBefore(draggedCard, target);
            } else {
              grid.appendChild(draggedCard);
            }
          });

          grid.addEventListener("drop", (event) => {
            event.preventDefault();
            saveOrder();
            applyVisibility();
          });
        });
      }

      function applyVisibility() {
        const query = searchInput.value.trim().toLowerCase();
        const hiddenApps = getHiddenApps();
        let visibleCount = 0;
        let liveVisibleCount = 0;

        document.querySelectorAll(".app-card").forEach((card) => {
          const app = appById.get(card.dataset.appId);
          const translatedName = translateApp(app).toLowerCase();
          const matchesSearch =
            !query ||
            app.name.toLowerCase().includes(query) ||
            translatedName.includes(query) ||
            app.href.toLowerCase().includes(query) ||
            app.group.toLowerCase().includes(query) ||
            translateSection(app.group).toLowerCase().includes(query);
          const matchesFilter =
            activeFilter === "all" || app.group === activeFilter;
          const visible = matchesSearch && matchesFilter && !hiddenApps[app.id];

          card.classList.toggle("hidden", !visible);
          if (visible) {
            visibleCount += 1;
            if (app.live) liveVisibleCount += 1;
          }
        });

        sections.forEach((section) => {
          const sectionEl = document.querySelector(
            `[data-section="${section.id}"]`,
          );
          const visibleCards = sectionEl.querySelectorAll(
            ".app-card:not(.hidden)",
          ).length;
          const count = sectionEl.querySelector("[data-count-for]");
          sectionEl.classList.toggle("hidden", visibleCards === 0);
          count.textContent = `${visibleCards} ${
            visibleCards === 1 ? t("appCountSingular") : t("appCountPlural")
          }`;
        });

        emptyState.classList.toggle("visible", visibleCount === 0);
        launcherStats.textContent = `${liveVisibleCount} ${t("liveApps")}`;
      }

      function hideApp(id) {
        const hiddenApps = getHiddenApps();
        hiddenApps[id] = true;
        saveHiddenApps(hiddenApps);
        applyVisibility();
      }

      function showAllApps() {
        saveHiddenApps({});
        applyVisibility();
      }

      function openCustomAppModal() {
        customAppForm.reset();
        customAppBackdrop.classList.add("visible");
        customAppBackdrop.setAttribute("aria-hidden", "false");
        customAppName.focus();
      }

      function closeCustomAppModal() {
        customAppBackdrop.classList.remove("visible");
        customAppBackdrop.setAttribute("aria-hidden", "true");
      }

      function addCustomApp(event) {
        event.preventDefault();
        const name = customAppName.value.trim();
        const href = normalizeUrl(customAppUrl.value);
        const icon = normalizeUrl(customAppIcon.value);
        if (!name || !href) return;

        const customApps = getCustomApps();
        const id = `custom-${Date.now().toString(36)}`;
        customApps.push({
          id,
          name,
          href,
          icon,
          group: "more",
        });
        saveCustomApps(customApps);
        closeCustomAppModal();
        render();
      }

      function removeCustomApp(id) {
        saveCustomApps(getCustomApps().filter((app) => app.id !== id));
        const hiddenApps = getHiddenApps();
        delete hiddenApps[id];
        saveHiddenApps(hiddenApps);
        render();
      }

      function resetLauncher() {
        localStorage.removeItem(STORAGE_KEYS.order);
        localStorage.removeItem(STORAGE_KEYS.hidden);
        localStorage.removeItem(STORAGE_KEYS.customApps);
        render();
      }

      function applyLanguage() {
        document.documentElement.lang = getLanguage();
        document.querySelector(".brand-title").textContent = t("launcherTitle");
        launcherStats.textContent = t("loadingApps");
        addCustomAppButton.title = t("addCustomApp");
        addCustomAppButton.setAttribute("aria-label", t("addCustomApp"));
        resetButton.title = t("resetLauncher");
        resetButton.setAttribute("aria-label", t("resetLauncher"));
        searchInput.placeholder = t("searchPlaceholder");
        emptyState.textContent = t("emptyState");
        document.getElementById("customAppTitle").textContent =
          t("customTitle");
        document.getElementById("customNameLabel").textContent =
          t("customName");
        document.getElementById("customUrlLabel").textContent = t("customLink");
        document.getElementById("customIconLabel").textContent =
          t("customIcon");
        document.getElementById("cancelCustomApp").textContent =
          t("cancelCustomApp");
        document.getElementById("saveCustomApp").textContent =
          t("saveCustomApp");
        document.getElementById("termsLink").textContent = t("terms");
        document.getElementById("privacyLink").textContent = t("privacy");
        closeCustomAppButton.title = t("closeCustomApp");
        closeCustomAppButton.setAttribute("aria-label", t("closeCustomApp"));

        const filterLabels = {
          all: t("allFilter"),
          core: t("coreFilter"),
          create: t("createFilter"),
          life: t("lifeFilter"),
          more: t("moreFilter"),
        };
        filterButtons.forEach((button) => {
          button.textContent = filterLabels[button.dataset.filter];
        });

        sections.forEach((section) => {
          const sectionTitle = document.querySelector(
            `[data-section="${section.id}"] .section-title`,
          );
          if (sectionTitle)
            sectionTitle.textContent = translateSection(section.id);
        });

        document.querySelectorAll(".app-card").forEach((card) => {
          const app = appById.get(card.dataset.appId);
          const name = card.querySelector(".app-name");
          if (app && name) {
            name.textContent = translateApp(app);
            card.setAttribute("aria-label", translateApp(app));
          }
        });
      }

      function closeContextMenus() {
        document
          .querySelectorAll(".context-menu")
          .forEach((menu) => menu.remove());
      }

      function showContextMenu(items, x, y) {
        closeContextMenus();
        const menu = document.createElement("div");
        menu.className = "context-menu liquid-glass";
        menu.style.left = `${Math.min(x, window.innerWidth - 206)}px`;
        menu.style.top = `${Math.min(y, window.innerHeight - 150)}px`;

        items.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = item.label;
          button.addEventListener("click", () => {
            item.action();
            closeContextMenus();
          });
          menu.append(button);
        });

        document.body.append(menu);
        requestAnimationFrame(() => {
          document.addEventListener("mousedown", closeContextMenus, {
            once: true,
          });
        });
      }

      document.addEventListener("click", (event) => {
        const link = event.target.closest("a");
        if (!link) return;
        link.target = "_top";
      });

      document.addEventListener("contextmenu", (event) => {
        const card = event.target.closest(".app-card");
        event.preventDefault();
        if (card) {
          const app = appById.get(card.dataset.appId);
          const items = [
            { label: t("hideApp"), action: () => hideApp(app.id) },
            { label: t("showAllApps"), action: showAllApps },
          ];
          if (app.custom) {
            items.splice(1, 0, {
              label: t("removeCustomApp"),
              action: () => removeCustomApp(app.id),
            });
          }
          items.push({ label: t("resetLauncher"), action: resetLauncher });
          showContextMenu(items, event.clientX, event.clientY);
          return;
        }

        showContextMenu(
          [
            { label: t("addCustomApp"), action: openCustomAppModal },
            { label: t("showAllApps"), action: showAllApps },
            { label: t("resetLauncher"), action: resetLauncher },
          ],
          event.clientX,
          event.clientY,
        );
      });

      searchInput.addEventListener("input", applyVisibility);

      addCustomAppButton.addEventListener("click", openCustomAppModal);

      resetButton.addEventListener("click", resetLauncher);
      customAppForm.addEventListener("submit", addCustomApp);
      closeCustomAppButton.addEventListener("click", closeCustomAppModal);
      cancelCustomAppButton.addEventListener("click", closeCustomAppModal);
      customAppBackdrop.addEventListener("click", (event) => {
        if (event.target === customAppBackdrop) closeCustomAppModal();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeCustomAppModal();
      });

      window.addEventListener("storage", (event) => {
        if (event.key === STORAGE_KEYS.language) {
          applyLanguage();
          applyVisibility();
        }
      });

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => {
          activeFilter = button.dataset.filter;
          filterButtons.forEach((filter) => {
            filter.setAttribute("aria-pressed", String(filter === button));
          });
          applyVisibility();
        });
      });

      render();
    </script>
  </body>
</html>
